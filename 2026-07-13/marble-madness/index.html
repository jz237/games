<script>
"use strict";
/* MARBLE MADNESS — practice build. Clean-room recreation: all code + art original.
   Engine: axonometric per-cell heightfield, painter-order prerender, fixed-step physics,
   dynamic (animated) wave bands, multi-race chain with time carryover, Steelie rival AI. */
const VERSION = '0.76.0';
const QA = new URLSearchParams(location.search).has('qa');

/* GRID DENSITY. Measured: the original's floor diamond is 3.15% of screen width, ours
   was 4.69% — its courses are the same physical size but made of ~1.5x MORE, SMALLER
   cells. GS is that factor.
   The whole change is confined to the CELL GRID: the array is GS times denser and each
   cell draws at 1/GS the screen size. WORLD UNITS DO NOT CHANGE — physics, the marble,
   hazards, course coordinates, the QA hooks and the bot waypoints all keep working in
   the original units, and the projection basis is untouched. The world->cell conversion
   happens in exactly two places: the height lookup and the cell renderer.
   gi/ge map an inclusive world range [v0,v1] to cell indices [round(v0*GS),
   round((v1+1)*GS)-1], so ADJACENT ranges tile with no gaps and no overlap — that is
   what lets per-cell authoring loops (the sawtooth carve in buildPractice) survive. */
const GS = 3;                                 // cells per authored world unit
const TSZ = Math.max(1, Math.round(GS/1.5));  // cells per drawn checker diamond
const gi = x => Math.round(x*GS);            // inclusive range START -> cell index
const ge = x => Math.round((x+1)*GS)-1;      // inclusive range END   -> cell index
/* ---------- projection basis (trimetric-ish; tune vs reference later) ---------- */
/* Marble size: the ONLY comparable metric is what fraction of the SCREEN it covers.
   Measured on the original: 55 px of its 1100 px screen = 5.0%.
   Cell-relative measures ("cells across", "marble ÷ diamond width") are not
   comparable — the original's grid is finer than ours, so the same marble spans a
   different number of cells. Both of those led me to wrong values.
   Here: 2*r*AXx / 640 = 5.0%  ->  r = 0.80 with AXx = 20. */
let AXx = 20, AXy = 10;       // +v (across): 2:1, a cell ≈ 3.1% of a 640px canvas
let AUx = -10, AUy = 14;      // +u (down course): steep down-left
const AZ  = 23;               // pixels per height unit
let DET = AXx*AUy - AUx*AXy;
let FLIP = false;             // true when +u renders up-screen (Silly race)
const BASIS_STD={axx:20,axy:10,aux:-10,auy:14}, BASIS_FLIP={axx:20,axy:10,aux:10,auy:-14};
function setBasis(b){ AXx=b.axx; AXy=b.axy; AUx=b.aux; AUy=b.auy;
  DET=AXx*AUy-AUx*AXy; FLIP=AUy<0; }
function projX(v,u){ return v*AXx + u*AUx; }
/* renderer helpers: the cell grid is GS times denser than world units */
function pX(v,u){ return (v/GS)*AXx + (u/GS)*AUx; }
function pY(v,u,z){ return (v/GS)*AXy + (u/GS)*AUy - z*AZ; }
function projY(v,u,z){ return v*AXy + u*AUy - z*AZ; }
function screenToGrid(sx,sy){ return { dv:(AUy*sx - AUx*sy)/DET, du:(-AXy*sx + AXx*sy)/DET }; }

/* ---------- course builder ---------- */
const NORMAL=0, GOAL=1;
const ABYSS=-2.5;
let CV=0, CU=0, cells=null, dynBand=null, decorFn=null, simT=0;
function newGrid(cv,cu){ CV=Math.round(cv*GS); CU=Math.round(cu*GS); dynBand=null; decorFn=null; hazards=[];
  cells=new Array(CU); for(let u=0;u<CU;u++) cells[u]=new Array(CV).fill(null); }
function put(v,u,h00,h10,h01,h11,o){ cells[u][v]={h00,h10,h01,h11,type:(o&&o.type)||NORMAL,tint:(o&&o.tint)||null,tex:(o&&o.tex)||null,dots:!!(o&&o.dots)}; }
function carve(v0,u0,v1,u1){ for(let u=gi(u0);u<=ge(u1);u++)for(let v=gi(v0);v<=ge(v1);v++)
  if(cells[u]) cells[u][v]=null; }
function slab(v0,u0,v1,u1,h,o){ for(let u=gi(u0);u<=ge(u1);u++)for(let v=gi(v0);v<=ge(v1);v++) put(v,u,h,h,h,h,o); }
function rampU(v0,u0,v1,u1,hTop,hBot,o){ const U0=gi(u0),U1=ge(u1),n=(U1+1-U0);
  for(let u=U0;u<=U1;u++){ const a=hTop+(hBot-hTop)*(u-U0)/n, b=hTop+(hBot-hTop)*(u+1-U0)/n;
    for(let v=gi(v0);v<=ge(v1);v++) put(v,u,a,a,b,b,o); } }
function rampV(v0,u0,v1,u1,hL,hR,o){ const V0=gi(v0),V1=ge(v1),n=(V1+1-V0);
  for(let v=V0;v<=V1;v++){ const a=hL+(hR-hL)*(v-V0)/n, b=hL+(hR-hL)*(v+1-V0)/n;
    for(let u=gi(u0);u<=ge(u1);u++) put(v,u,a,b,a,b,o); } }
function waves(v0,u0,v1,u1,hTop,hBot,amp,perV,perU,o){
  const V0=gi(v0),V1=ge(v1),U0=gi(u0),U1=ge(u1), PV=perV*GS, PU=perU*GS;
  const f=(v,u)=>{ const t=(u-U0)/(U1+1-U0);
    const eased=Math.min(1,Math.min(u-U0,(U1+1)-u)/(2.2*GS));
    return hTop+(hBot-hTop)*t + amp*Math.max(0,eased)*Math.sin(v*Math.PI*2/PV)*Math.sin(u*Math.PI*2/PU); };
  for(let u=U0;u<=U1;u++)for(let v=V0;v<=V1;v++) put(v,u,f(v,u),f(v+1,u),f(v,u+1),f(v+1,u+1),o);
}
/* the old footprint was a fixed 2x2 CELLS; in world terms that is a 2x2 patch, which at
   GS covers more cells — so it is rebuilt as a cone over the scaled block, keeping the
   peak the same physical size instead of shrinking as the grid gets finer */
function pyramid(v,u,base,peak,o){ const oo=o||{};
  const V0=gi(v),V1=ge(v+1),U0=gi(u),U1=ge(u+1);
  const cx=(V0+V1+1)/2, cy=(U0+U1+1)/2, rx=(V1+1-V0)/2, ry=(U1+1-U0)/2;
  const f=(vv,uu)=>{ const d=Math.max(Math.abs(vv-cx)/rx,Math.abs(uu-cy)/ry);
    return base+(peak-base)*Math.max(0,1-d); };
  for(let uu=U0;uu<=U1;uu++)for(let vv=V0;vv<=V1;vv++)
    put(vv,uu,f(vv,uu),f(vv+1,uu),f(vv,uu+1),f(vv+1,uu+1),oo); }
/* animated band: cells must ALSO be authored (static shape ~ t=0) for prerender bounds */
function dynWaves(v0,u0,v1,u1,hTop,hBot,amp,perV,perU,speed,o){
  dynBand={v0:gi(v0),u0:gi(u0),v1:ge(v1),u1:ge(u1),hTop,hBot,amp,perV:perV*GS,perU:perU*GS,
    speed,tint:(o&&o.tint)||null,tex:(o&&o.tex)||null};
  waves(v0,u0,v1,u1,hTop,hBot,amp,perV,perU,o);
}
function dynH(v,u,t){ const b=dynBand;
  const tt=(u-b.u0)/(b.u1+1-b.u0);
  const easeU=Math.min(1,Math.min(u-b.u0,(b.u1+1)-u)/(2.2*GS));
  const easeV=Math.min(1,Math.min(v-b.v0,(b.v1+1)-v)/(1.2*GS));
  const eased=Math.max(0,Math.min(easeU,easeV));
  return b.hTop+(b.hBot-b.hTop)*tt + b.amp*eased*Math.sin(v*Math.PI*2/b.perV + t*b.speed*0.7)*Math.sin(u*Math.PI*2/b.perU + t*b.speed);
}
function inDyn(v,u){ return dynBand && v>=dynBand.v0 && v<dynBand.v1+1 && u>=dynBand.u0 && u<dynBand.u1+1; }
function cellAt(v,u){ const iu=Math.floor(u), iv=Math.floor(v);
  if(iu<0||iu>=CU||iv<0||iv>=CV) return null; return cells[iu][iv]; }
let hazards=[];              // per-race entities: muncher | acid | hill | tube
function hillsAt(v,u){ let dh=0;
  for(const h of hazards){ if(h.type!=='hill') continue;
    const dv=v-h.cv, du=u-h.cu, q=(dv*dv+du*du)/(2*h.sig*h.sig);
    if(q<9) dh+=h.amp*Math.exp(-q); }
  return dh; }
/* v,u come in as WORLD coordinates; the cell grid is GS times denser, so this is where
   the conversion lives. hillsAt still takes world coordinates (its hazards are authored
   in them), so it is passed the unconverted pair. */
function groundH(wv,wu){ const v=wv*GS, u=wu*GS;
  const c=cellAt(v,u); if(!c) return NaN;
  let base;
  if(inDyn(v,u)){
    const iv=Math.floor(v), iu=Math.floor(u), fv=v-iv, fu=u-iu;
    const a=dynH(iv,iu,simT)*(1-fv)+dynH(iv+1,iu,simT)*fv;
    const b=dynH(iv,iu+1,simT)*(1-fv)+dynH(iv+1,iu+1,simT)*fv;
    base=a*(1-fu)+b*fu;
  } else {
    const fv=v-Math.floor(v), fu=u-Math.floor(u);
    base=(c.h00*(1-fv)+c.h10*fv)*(1-fu) + (c.h01*(1-fv)+c.h11*fv)*fu;
  }
  return base+hillsAt(wv,wu); }

/* ---------- races ---------- */
function buildPractice(){ newGrid(24,88);
  const RED={tint:'#bb4455'}, DARK={tint:'#778899'}, GRID={tex:'grid'};
  /* Opening plain rebuilt from the real Amiga screen (iteration 25): a broad
     FLAT checkerboard plain with a sawtooth far edge, twin white-tipped peaks
     on a stepped centre island, and a raised diamond platform either side. */
  slab(3,0,20,13,12,GRID);
  for(let v=3;v<=20;v++){                       // three-peak sawtooth far edge
    const t=((v-3)%6)/6, cut=Math.round(4.5*Math.abs(t-0.5)*2);
    if(cut>0) carve(v,0,v,cut-1);
  }
  slab(4,6,7,8,12.9,GRID);                      // left diamond platform (under the arch)
  slab(16,6,19,8,12.9,GRID);                    // right diamond platform
  slab(9,8,14,11,12.7,GRID);                    // centre island base
  slab(10,8,13,11,13.05,GRID);                  // middle step — the original is a ziggurat
  slab(10,9,13,10,13.4,GRID);                   // its stepped tier
  pyramid(10,9,13.4,17.6,{tint:'#dddddd'});     // twin white-tipped peaks
  pyramid(12,9,13.4,17.6,{tint:'#dddddd'});
  rampU(3,14,20,19,12,10,GRID);
  slab(3,20,20,27,10);
  pyramid(5,21,10,12.2); pyramid(17,21,10,12.2);
  slab(8,22,15,24,12.6,RED);
  slab(10,22,11,24,10);  slab(13,22,14,24,10);
  slab(8,22,8,24,12.6,RED); slab(12,22,12,24,12.6,RED); slab(15,22,15,24,12.6,RED);
  waves(3,28,20,43,10,5,0.6,6,8,GRID);
  rampU(3,44,20,50,5,4);
  slab(16,45,19,49,5.6,RED);
  slab(14,51,17,51,4,DARK);
  slab(3,51,13,51,5,DARK);
  rampV(4,52,17,56,2.5,4,DARK);
  slab(4,57,7,57,2.5,DARK);
  slab(8,57,17,57,4.8,DARK);
  rampV(4,58,17,62,2.5,1,DARK);
  slab(14,63,17,63,1,DARK);
  slab(3,63,13,63,3.6,DARK);
  slab(3,52,3,63,6,DARK); slab(18,52,18,63,6,DARK);
  rampU(3,64,18,72,1,0.5);
  slab(19,64,19,72,3); slab(2,64,2,72,3);
  rampU(2,73,13,77,0.5,0);
  slab(2,78,13,82,0);
  slab(3,78,12,79,0,{type:GOAL});
  for(const [bv,val] of [[3.5,3],[6.5,4],[9.5,5],[12.5,6]])
    hazards.push({type:'bonus',v:bv,u:76.3,val,taken:false});
  slab(14,73,14,83,2.5); slab(1,73,1,83,2.5); slab(2,83,13,83,2.5);
  decorFn=(g,ox,oy)=>{
    g.strokeStyle='rgba(238,238,255,.85)'; g.lineWidth=2.5; g.setLineDash([8,6]); g.beginPath();
    for(let i=0;i<=30;i++){ const v=3.4+(20.4-3.4)*i/30; const h=groundH(v,8);
      const x=projX(v,8)+ox, y=projY(v,8,isNaN(h)?12:h+0.03)+oy;
      if(i===0) g.moveTo(x,y); else g.lineTo(x,y); }
    g.stroke(); g.setLineDash([]);
    // red tube arch gates flanking the course, as on the original
    for(const [av,au] of [[5.5,8],[17.5,8],[5.5,33],[17.5,33],[5.5,66],[15.5,66]]) archGate(g,ox,oy,av,au);
    // painted arrows on the floor pointing down-course
    for(const [av,au,tn] of [[11.5,26],[6.5,38],[16.5,38],[11.5,58],[8,70]]) floorArrow(g,ox,oy,av,au,tn);
    // pair flanking the centre island — they CONVERGE, steering you back to the middle
    // once you are past it (measured; v0.49.0 had these angled outward)
    floorArrow(g,ox,oy,6.5,13,0.62); floorArrow(g,ox,oy,16.5,13,-0.62);
    // handrails along the centre structure's two side edges, post at the near end
    railing(g,ox,oy,8.8,11.8,8.8,7.9); railing(g,ox,oy,14.2,11.8,14.2,7.9);
    for(const [cv,cu] of [[10.5,53.5],[10.5,55.5],[10.5,59],[10.5,61]]){
      const h=groundH(cv,cu); if(isNaN(h)) continue;
      const px=projX(cv,cu)+ox, py=projY(cv,cu,h+0.05)+oy;
      g.save(); g.setTransform(AXx,AXy,AUx,AUy,px,py);
      g.strokeStyle='rgba(255,255,255,.75)'; g.lineWidth=0.16;
      const dir=(cu<57)?-1:1;
      g.beginPath(); g.moveTo(dir*0.5,-0.4); g.lineTo(-dir*0.3,0); g.lineTo(dir*0.5,0.4); g.stroke();
      g.restore(); }
    goalText(g,8,75.6,0.28,ox,oy);
  };
}
function buildBeginner(){ newGrid(26,110);
  const GRID={tex:'grid'}, PINK={tint:'#cc6699'}, TEAL={tex:'grid',tint:'#77bbbb'};
  // start plateau with box obstacles
  slab(3,0,22,8,14,GRID);
  slab(5,2,7,3,15.2,GRID); slab(16,4,18,5,15.2,GRID); slab(10,6,11,7,15.2,GRID);
  // terraces with offset ramps (fall risk at edges)
  slab(3,9,22,9,14,GRID);
  rampU(6,10,9,11,14,12); slab(3,12,22,12,12,GRID); slab(3,10,5,11,12,GRID); slab(10,10,22,11,12,GRID);
  rampU(16,13,19,14,12,10); slab(3,15,22,15,10,GRID); slab(3,13,15,14,10,GRID); slab(20,13,22,14,10,GRID);
  // split level: main path + side platform over void channel
  slab(3,16,12,24,10,GRID);
  slab(15,16,22,24,10,GRID);
  slab(13,18,14,24,10,GRID);                       // bridge runs to the channel end
  // pyramid zone (reference map shows green munchers here)
  slab(3,25,22,31,10,GRID);
  pyramid(6,26,10,12); pyramid(12,26,10,12); pyramid(18,26,10,12);
  hazards.push({type:'muncher',v:9,u:27.5,homeV:9,homeU:27.5,phase:0,state:'idle',hopT:0,tv:9,tu:27.5,docile:true});
  hazards.push({type:'muncher',v:13,u:30,homeV:13,homeU:30,phase:0.9,state:'idle',hopT:0,tv:13,tu:30,docile:true});
  // narrow to right-side channel, then pink slide down
  slab(14,32,21,38,10,GRID);
  for(let su=39;su<=46;su++){ // curved pink slide: center bulges right then returns
    const t=(su-39)/7, c=17.5+2.2*Math.sin(t*Math.PI);
    const hT=10+(su-39)*(4-10)/8, hB=10+(su-38)*(4-10)/8;
    const v0=Math.round(c-2.5), v1=Math.round(c+2.5);
    rampU(v0,su,v1,su,hT,hB,PINK);
    slab(v0-1,su,v0-1,su,hT+2,PINK); slab(v1+1,su,v1+1,su,hT+2,PINK);
  }
  // lower deck, twin narrow bridges over the big void
  slab(3,47,22,56,4,GRID);
  // pink tunnel-house: drop in, come out past the bridges (the map's doorway shortcut)
  slab(3,48,6,51,6.4,{tint:'#cc6699'});
  slab(4,48,5,48,4,GRID);
  carve(4,49,5,50);
  hazards.push({type:'tube',rect:{v0:4,v1:6,u0:49,u1:51},exit:{v:12.5,u:62},busyT:0});
  rampU(5,57,6,60,4,3); rampU(17,57,18,60,4,3);           // two 2-wide bridges
  slab(3,61,22,64,3,GRID);
  // steelie zone with a catapult flinger (map shows pink catapults here)
  slab(3,65,22,74,3,GRID);
  slab(8,68,9,69,4.2,GRID); slab(15,71,16,72,4.2,GRID);
  slab(11,66,13,67,3.02,{tex:'grid',tint:'#ddaa44'});
  hazards.push({type:'catapult',rect:{v0:11,v1:14,u0:66,u1:68},launch:{vv:0,vu:8.5,vz:5.5},snap:{v:12.5,u:67},busyT:0});
  // descent to the waves
  rampU(3,75,22,80,3,1.2,GRID);
  slab(3,81,22,82,1.2,GRID);
  // ANIMATED wave floor with central pit
  dynWaves(3,83,22,98,1.2,0.6,0.5,6,7,2.2,TEAL);
  for(let cu=86;cu<=93;cu++)for(let cvv=9;cvv<=16;cvv++)
    if(Math.hypot(cvv+0.5-13,cu+0.5-90)<2.4) carve(cvv,cu,cvv,cu);
  // goal apron
  rampU(3,99,22,102,0.6,0.2);
  slab(3,103,22,106,0.2);
  slab(4,104,21,105,0.2,{type:GOAL});
  slab(2,99,2,107,2.2); slab(23,99,23,107,2.2); slab(3,107,22,107,2.2);
  decorFn=(g,ox,oy)=>{ goalText(g,12.5,101.2,0.45,ox,oy); };
}
function buildIntermediate(){ newGrid(26,100);
  const CHK={tex:'check',tint:'#cc8855'}, CHKD={tex:'check',tint:'#996644'}, PINK={tint:'#cc6699'}, GRN={tint:'#66aa66'};
  // twin start spurs (1P uses left) merging onto a deck
  slab(4,0,8,4,14,CHK); slab(17,0,21,4,14,CHK);
  rampU(4,5,8,8,14,12,CHK); rampU(17,5,21,8,14,12,CHK);
  slab(3,9,22,14,12,CHK);
  // mesa maze: raised blocks over the deck, channels between
  slab(3,15,22,30,12,CHK);
  slab(4,16,8,19,14,CHKD); slab(12,16,16,18,14,CHKD); slab(19,16,22,20,14,CHKD);
  slab(3,22,7,26,14,CHKD); slab(11,21,15,25,14,CHKD); slab(18,23,22,27,14,CHKD);
  hazards.push({type:'muncher',v:9.5,u:20,homeV:9.5,homeU:20,phase:0,state:'idle',hopT:0,tv:9.5,tu:20});
  hazards.push({type:'muncher',v:16.5,u:27,homeV:16.5,homeU:27,phase:1.4,state:'idle',hopT:0,tv:16.5,tu:27});

/* ---------- prerender ---------- */
/* AMIGA 4-BIT COLOUR. Measured across two lossless reference frames: every colour the
   original draws is a multiple of 17 per channel — #999999, #bbbbbb, #666666 and #dddddd
   alone are 39% of all pixels, and the median channel error over the top 40 colours is 1
   (capture scaling noise). Our shading multiplied the same base palette into a continuum,
   which is why our floor histogram spreads where the original's has four hard peaks.
   Everything drawn on the course goes through this so the steps stay hard. */
/* REALISTIC MODE (2026-07-28, user direction): the Amiga's 4-bit palette is what made
   everything read as hard flat bands. Quantisation is off so shading can be continuous;
   the measured palette values stay as the BASE colours, they are just no longer snapped
   after shading. Set QUANTISE back to true to get the period-accurate look back. */

  return QUANTISE ? Math.round(c/17)*17 : Math.round(c); };

function shadeHex(h,k){ const [r,g,b]=hex2rgb(h); return rgb17(r*k,g*k,b*k); }
function isGreyCell(c){ if(!c.tint) return true;
  const [r,g,b]=hex2rgb(c.tint); return Math.max(r,g,b)-Math.min(r,g,b)<38; }
function baseRGB(c){ if(c.tint) return hex2rgb(c.tint);
  const avg=(c.h00+c.h10+c.h01+c.h11)/4;
  return hex2rgb(avg>=13.9?PAL.floorHi:PAL.floorLo); }

  const s=(c.h01+c.h11-c.h00-c.h10)/2; const [r,g,b]=baseRGB(c);
  const avgH=(c.h00+c.h10+c.h01+c.h11)/4;

       - a wall face is ONE colour, not a cycle through the ramp. Reading a scanline
         across the reference's walls gives `YELx20 greyx6 YELx20 ...` on the course's
         left and `redx20 darkx6 redx20 ...` on its right — long single-hue runs.
       - the stripe period is ~26 px against a 30 px floor diamond, i.e. ONE STRIPE PER
         DIAMOND. We drew `nStripes:8` per cell, which after the GS=3 grid change came out
         at roughly 1.3 px per stripe — visually just noise.
       So: pick one hue from the ramp by position across the course (yellow on the left
       through orange to dark red on the right) and fill the whole cell face with it. */
    /* CORRECTION to v0.62.0, from captures/struct-full.png (the whole centre structure at
       2x): the hue is set by the wall's ORIENTATION, not by position across the course.
       Faces pointing down-LEFT (the +u edge, parallel to +v) are yellow; faces pointing
       down-RIGHT (the +v edge) are dark red. That explains the structure's mixed risers —
       both orientations are visible on it — AND the two big course-edge walls being
       uniformly yellow on the left and red on the right, which position also happened to
       explain. Orange appears among the yellow at roughly 1 in 4 (measured 17% yellow to
       6% orange), so it is used as an accent on that orientation. */

    const st=PAL.stripes;                       // [dark red, orange, yellow]

    const hi=st[st.length-1], accent=st[Math.max(0,st.length-2)];

    cols=[shadeHex(hue,k)]; N=1;

      const [br,bg,bb]=cssRGB(base);

function edgeContours(g,v,u,ox,oy,c,x00,y00,x10,y10,x01,y01,x11,y11){

    [u+1<CU?cells[u+1][v]:null,   'h00','h10','h01','h11', x01,y01,x11,y11],  // +u edge
    [v>0?cells[u][v-1]:null,      'h10','h11','h00','h01', x00,y00,x01,y01],  // -v edge
    [v+1<CV?cells[u][v+1]:null,   'h00','h01','h10','h11', x10,y10,x11,y11]]; // +v edge

const Snd=(()=>{ let ac=null,master=null,rollGain=null,rollFilt=null,muted=QA,musicBus=null;
  function ctx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=0.5; master.connect(ac.destination);
      musicBus=ac.createGain(); musicBus.gain.value=muted?0:0.5; musicBus.connect(master);
      if(window.__bindMusic) window.__bindMusic(ac,musicBus);
      const len=ac.sampleRate*1.2, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
      rollFilt=ac.createBiquadFilter(); rollFilt.type='bandpass'; rollFilt.Q.value=1.1; rollFilt.frequency.value=300;
      rollGain=ac.createGain(); rollGain.gain.value=0;
      src.connect(rollFilt).connect(rollGain).connect(master); src.start();
    }catch(e){ ac=null; } } return ac; }
  function env(type,f0,f1,dur,vol,delay){ const a=ctx(); if(!a||muted) return;
    const t=a.currentTime+(delay||0); const o=a.createOscillator(); o.type=type;
    o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    const gn=a.createGain(); gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(gn).connect(master); o.start(t); o.stop(t+dur+.02); }
  function noise(dur,hp,vol,delay){ const a=ctx(); if(!a||muted) return;
    const t=a.currentTime+(delay||0); const len=a.sampleRate*dur, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=a.createBufferSource(); src.buffer=buf; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
    const gn=a.createGain(); gn.gain.value=vol; src.connect(f).connect(gn).connect(master); src.start(t); }
  return {
    unlock(){ const a=ctx(); if(a&&a.state==='suspended') a.resume(); },
    setMuted(m){ muted=m; if(rollGain) rollGain.gain.value=0;
      if(musicBus) musicBus.gain.value=m?0:0.5; }, get muted(){ return muted; },
    roll(speed,grounded){ if(!ac||muted||!rollGain) return;
      const target=grounded?Math.min(1,speed/9)*0.32:0;
      rollGain.gain.setTargetAtTime(target,ac.currentTime,0.06);
      rollFilt.frequency.setTargetAtTime(240+speed*55,ac.currentTime,0.08); },
    clack(sp){ env('square',150+sp*8,90,0.07,0.25); noise(0.05,900,0.18); },
    thud(){ env('sine',120,60,0.16,0.3); noise(0.08,300,0.2); },
    shatter(){ noise(0.45,1300,0.5); env('sine',1400,320,0.5,0.22); env('sine',990,240,0.62,0.16,0.05); },
    fall(){ env('sine',880,140,0.8,0.22); },
    ready(i){ env('square',i===2?660:330,0,0.09,0.22); },
    goal(){ [523,659,784,1047,1319].forEach((f,i)=>{ env('square',f,0,0.14,0.2,i*0.09); env('triangle',f/2,0,0.16,0.18,i*0.09); }); },
    tick(){ env('square',1000,0,0.03,0.14); },
    count(){ env('square',1320,0,0.025,0.12); },
    gulp(){ env('square',300,90,0.18,0.3); env('sine',150,60,0.28,0.25,0.07); },
    boing(){ env('square',160,420,0.2,0.24); env('triangle',90,260,0.22,0.2,0.02); },
    squish(){ noise(0.09,500,0.3); env('sine',520,140,0.12,0.2); },
    vac(){ env('sawtooth',180,950,0.55,0.22); },
    sizzle(){ noise(0.5,1900,0.42); env('sawtooth',220,70,0.5,0.1); },
    over(){ env('sawtooth',330,110,0.9,0.25); }
  };
})();

      const gv=(groundH(m.v+e,m.u)-groundH(m.v-e,m.u))/(2*e);
      const gu=(groundH(m.v,m.u+e)-groundH(m.v,m.u-e))/(2*e);
      const tb=(m.kind==='player')&&(m.pIdx===1?turbo2:turbo);
      const ta=tb?TURBO_ACC:1;
      m.vv+=(accV*ta-(isNaN(gv)?0:gv)*GRAV*0.55)*dt;
      m.vu+=(accU*ta-(isNaN(gu)?0:gu)*GRAV*0.55)*dt;
      const sp=Math.hypot(m.vv,m.vu);
      const lim=MAXSP*(tb?TURBO_SP:1)+Math.max(0,-(isNaN(gu)?0:gu))*4;
      const f=1/(1+FRICT*dt*0.32); m.vv*=f; m.vu*=f;
      if(sp>lim){ m.vv*=lim/sp; m.vu*=lim/sp; }
    }
  } else { m.vz-=GRAV*dt; }
  // rolling-without-slipping spin, used to turn the surface pattern
  {
    const sp=Math.hypot(m.vv,m.vu);
    if(sp>0.02){
      const dx=(m.vv*AXx+m.vu*AUx), dy=(m.vv*AXy+m.vu*AUy);
      const dl=Math.hypot(dx,dy)||1;
      m.spinX=dx/dl; m.spinY=dy/dl;
    }
    m.spin=(m.spin||0)+sp*dt/Math.max(0.2,m.r)*0.55;
  }
  // axis-separated wall checks
  let nv=m.v+m.vv*dt, nu=m.u+m.vu*dt;
  const h0=groundH(m.v,m.u);
  const pv=nv+Math.sign(m.vv)*m.r*0.6, hv=groundH(pv,m.u);
  const blockedV = m.grounded ? (!isNaN(hv)&&!isNaN(h0)&&hv-h0>0.55)
                              : (!isNaN(hv)&&hv>m.z+0.3);
  if(blockedV){ if(Math.abs(m.vv)>2&&m.kind==='player')Snd.clack(Math.abs(m.vv)); m.vv*=-0.38; nv=m.v; }
  const pu=nu+Math.sign(m.vu)*m.r*0.6, hu=groundH(m.v,pu);
  const blockedU = m.grounded ? (!isNaN(hu)&&!isNaN(h0)&&hu-h0>0.55)
                              : (!isNaN(hu)&&hu>m.z+0.3);
  if(blockedU){ if(Math.abs(m.vu)>2&&m.kind==='player')Snd.clack(Math.abs(m.vu)); m.vu*=-0.38; nu=m.u; }
  m.v=nv; m.u=nu;
  const h2=groundH(m.v,m.u);
  if(m.grounded){
    if(isNaN(h2)){ m.grounded=false; m.vz=0; }
    else if(h2 < m.z-0.09){ m.grounded=false; m.vz=Math.max(-3,(h2-m.z)*6); }
    else { m.z=h2; }
  }
  if(!m.grounded){
    const zPrev=m.z;
    m.z+=m.vz*dt;
    if(!isNaN(h2)&&m.z<=h2&&(zPrev>=h2-0.3||h2-m.z<1.4)){
      const impact=-m.vz;
      if(impact>14&&!m.dropIn){ m.z=h2; die(m,'shatter'); return; }
      m.z=h2; m.grounded=true; m.dropIn=false;
      if(impact>3.5){ m.vz=impact*0.18; m.grounded=false; m.z+=0.001; if(m.kind==='player')Snd.clack(impact*0.7); }
      else m.vz=0;
    }
    if(m.z<ABYSS-3.5){ die(m,'fall'); }
  }
}
function updateHazards(dt){
  for(const h of hazards){
    if(h.type==='acid'){
      h.v+=h.dv*dt; h.u+=h.du*dt; h.wob+=dt;
      if(h.v<h.zone.v0||h.v>h.zone.v1){ h.dv*=-1; h.v=Math.max(h.zone.v0,Math.min(h.zone.v1,h.v)); }
      if(h.u<h.zone.u0||h.u>h.zone.u1){ h.du*=-1; h.u=Math.max(h.zone.u0,Math.min(h.zone.u1,h.u)); }
      for(const pl of players) if(pl.alive&&!pl.hidden&&pl.grounded&&Math.hypot(pl.v-h.v,pl.u-h.u)<h.r+0.5)
        die(pl,'dissolved');
    } else if(h.type==='hill'){
      h.cv+=h.dV*dt; h.cu+=(h.dU||0)*dt;
      if(h.cv<h.zone.v0||h.cv>h.zone.v1){ h.dV*=-1; h.cv=Math.max(h.zone.v0,Math.min(h.zone.v1,h.cv)); }
      if(h.cu<h.zone.u0||h.cu>h.zone.u1){ h.dU*=-1; h.cu=Math.max(h.zone.u0,Math.min(h.zone.u1,h.cu)); }
    } else if(h.type==='muncher'){
      h.phase+=dt;
      if(h.state==='idle'){
        h.hopT+=dt;
        if(h.hopT>0.85){ h.hopT=0;
          let tv=h.homeV+Math.sin(h.phase*0.7)*1.6, tu=h.homeU+Math.cos(h.phase*0.5)*1.2;
          if(!h.docile){ let best=null,bd=7.5;
            for(const pl of players) if(pl.alive&&!pl.hidden){ const d=Math.hypot(pl.v-h.v,pl.u-h.u);
              if(d<bd){ bd=d; best=pl; } }
            if(best){ tv=best.v; tu=best.u; } }
          const dd=Math.hypot(tv-h.v,tu-h.u)||1, L=Math.min(1.7,dd);
          h.sv=h.v; h.su=h.u; h.tv=h.v+(tv-h.v)/dd*L; h.tu=h.u+(tu-h.u)/dd*L;
          h.state='hop'; h.hopK=0;
        }
      } else {
        h.hopK+=dt*2.7;
        const k=Math.min(1,h.hopK);
        h.v=h.sv+(h.tv-h.sv)*k; h.u=h.su+(h.tu-h.su)*k;
        if(k>=1){ h.state='idle';
          for(const pl of players) if(pl.alive&&!pl.hidden&&pl.grounded&&Math.hypot(pl.v-h.v,pl.u-h.u)<1.3)
            die(pl,'eaten');
        }
      }
    } else if(h.type==='hammer'){
      h.phase=(h.phase+dt)%1.7;
      // slam window just after t=1.2
      if(h.phase>=1.2&&h.phase<1.32&&!h.hit){
        h.hit=true;
        for(const pl of players){ if(pl.alive&&!pl.hidden&&pl.grounded&&
            Math.hypot(pl.v-h.v,pl.u-h.u)<1.35) die(pl,'smashed'); }
        if(Math.hypot(player.v-h.v,player.u-h.u)<7) Snd.thud();
      }
      if(h.phase<1.2) h.hit=false;
    } else if(h.type==='piston'){
      h.phase=(h.phase+dt)%2.2;
      if(h.phase<0.1&&!h.hit){ h.hit=true;
        for(const pl of players) if(pl.alive&&!pl.hidden&&Math.hypot(pl.v-h.v,pl.u-h.u)<1.35){
          const dv=pl.v-h.v||0.3, du=pl.u-h.u||0.3, d=Math.hypot(dv,du);
          pl.vv+=dv/d*6.5; pl.vu+=du/d*6.5; pl.vz=5.5; pl.grounded=false;
          Snd.boing(); }
      }
      if(h.phase>0.5) h.hit=false;
    } else if(h.type==='vacuum'){
      for(const pl of players) if(pl.alive&&!pl.hidden&&pl.grounded&&
        pl.v>=h.zone.v0&&pl.v<=h.zone.v1&&pl.u>=h.zone.u0&&pl.u<=h.zone.u1){
        const dv=h.v-pl.v, du=h.u-pl.u, d=Math.hypot(dv,du)||1;
        pl.vv+=dv/d*h.pull*dt; pl.vu+=du/d*h.pull*dt;
        if(d<1.0) die(pl,'sucked');
      }
    } else if(h.type==='catapult'){
      if(h.busyT>0){ h.busyT-=dt;
        if(h.busyT<=0&&h.captive){ const pl=h.captive; h.captive=null;
          pl.hidden=false; pl.grounded=false;
          pl.vv=h.launch.vv; pl.vu=h.launch.vu; pl.vz=h.launch.vz;
          pl.z+=0.15; Snd.boing(); }
      } else { for(const pl of players) if(pl.alive&&!pl.hidden&&pl.grounded&&
          pl.v>=h.rect.v0&&pl.v<=h.rect.v1&&pl.u>=h.rect.u0&&pl.u<=h.rect.u1){
          h.busyT=0.35; h.captive=pl; pl.hidden=true; pl.vv=0; pl.vu=0;
          if(h.snap){ pl.v=h.snap.v; pl.u=h.snap.u; } break; } }
    } else if(h.type==='critter'){
      if(!h.alive){ h.splatT+=dt; continue; }
      h.phase+=dt;
      if(h.phase>1.1){ h.phase=0;
        const a=Math.random()*Math.PI*2; h.dv=Math.cos(a)*1.3; h.du=Math.sin(a)*1.3; }
      h.v+=h.dv*dt; h.u+=h.du*dt;
      if(h.v<h.zone.v0||h.v>h.zone.v1){ h.dv*=-1; h.v=Math.max(h.zone.v0,Math.min(h.zone.v1,h.v)); }
      if(h.u<h.zone.u0||h.u>h.zone.u1){ h.du*=-1; h.u=Math.max(h.zone.u0,Math.min(h.zone.u1,h.u)); }
      for(const pl of players) if(pl.alive&&!pl.hidden&&pl.grounded&&Math.hypot(pl.v-h.v,pl.u-h.u)<1.0){
        h.alive=false; h.splatT=0; pl.score+=h.pink?800:500; pl.timeLeft+=1; Snd.squish(); break; }
    } else if(h.type==='bonus'){
      if(!h.taken) for(const pl of players)
        if(pl.alive&&!pl.hidden&&pl.grounded&&Math.hypot(pl.v-h.v,pl.u-h.u)<0.95){
          h.taken=true; pl.score+=h.val*1000;
          addFloater(h.v,h.u,0.3,'+'+(h.val*1000),'#ffcc33');
          Snd.goal(); break; }
    } else if(h.type==='tube'){
      if(h.busyT>0){ h.busyT-=dt;
        if(h.busyT<=0&&h.captive){ const pl=h.captive; h.captive=null;
          pl.v=h.exit.v; pl.u=h.exit.u; const hh=groundH(pl.v,pl.u);
          pl.z=(isNaN(hh)?6:hh)+1.6; pl.vv=0; pl.vu=1.6; pl.vz=0;
          pl.grounded=false; pl.dropIn=true; pl.hidden=false;
        }
      } else { for(const pl of players) if(pl.alive&&!pl.hidden&&pl.z<12.6&&
          pl.v>=h.rect.v0&&pl.v<=h.rect.v1&&pl.u>=h.rect.u0&&pl.u<=h.rect.u1&&
          !cellAt(pl.v*GS,pl.u*GS)){
          h.busyT=0.8; h.captive=pl; pl.hidden=true; pl.vv=0; pl.vu=0; Snd.fall(); break; } }
    }
  }
}
function collideMarbles(a,b){
  if(!a.alive||!b.alive||!a.active||!b.active) return;
  // a marble materialising from a catch-up warp must not knock the leader off:
  // it used to land directly on them and shove them into the void, repeatedly
  if(a.dropIn||b.dropIn) return;
  if(Math.abs(a.z-b.z)>1.6) return;
  const dv=b.v-a.v, du=b.u-a.u, d=Math.hypot(dv,du), rr=a.r+b.r-0.15;
  if(d<=0.0001||d>=rr) return;
  const nx=dv/d, ny=du/d, overlap=rr-d;
  const tm=a.mass+b.mass;
  a.v-=nx*overlap*(b.mass/tm); a.u-=ny*overlap*(b.mass/tm);
  b.v+=nx*overlap*(a.mass/tm); b.u+=ny*overlap*(a.mass/tm);
  const rel=(b.vv-a.vv)*nx+(b.vu-a.vu)*ny;
  if(rel<0){ const j=-(1.55)*rel/(1/a.mass+1/b.mass);
    a.vv-=j*nx/a.mass; a.vu-=j*ny/a.mass;
    b.vv+=j*nx/b.mass; b.vu+=j*ny/b.mass;
    if(Math.abs(rel)>2.5) Snd.thud(); }
}
function racersRacing(){ return players.filter(pl=>!pl.out&&!pl.finished); }
function physics(dt){
  if(state!=='race'||paused) return;
  simT+=dt; raceT+=dt;
  if(deathMsgT>0) deathMsgT-=dt;
  let anyLow=false;
  for(const pl of players){ if(pl.out||pl.finished) continue;
    pl.timeLeft-=dt;
    if(pl.timeLeft<=6&&pl.timeLeft>0) anyLow=true;
    if(pl.timeLeft<=0){ pl.timeLeft=0; pl.out=true; pl.alive=false; Snd.over(); } }
  const secAll=Math.ceil(Math.min(...players.filter(pl=>!pl.out&&!pl.finished).map(pl=>pl.timeLeft),99));
  if(anyLow&&secAll!==lastTickSec){ lastTickSec=secAll; Snd.tick(); }
  if(players.every(pl=>pl.out)){ state='timeup'; stateT=0;
    if(document.pointerLockElement===cv&&document.exitPointerLock) document.exitPointerLock(); return; }
  if(players.every(pl=>pl.out||pl.finished)){ state='goal'; stateT=0;
    if(document.pointerLockElement===cv&&document.exitPointerLock) document.exitPointerLock(); return; }
  // steelie activation + AI
  const R=RACES[raceIdx];
  const leader=players.reduce((a,b)=>((b.out?-1:b.u)>(a.out?-1:a.u)?b:a),players[0]);
  if(R.steelie&&!steelie.active&&leader.u>R.steelie.triggerU){
    steelie.active=true; steelie.alive=true; steelie.v=R.steelie.v; steelie.u=R.steelie.u;
    const sh=groundH(steelie.v,steelie.u); steelie.z=(isNaN(sh)?4:sh)+1.5; steelie.grounded=false; steelie.vz=0;
    steelie.vv=0; steelie.vu=0; steelie.dropIn=true; }
  pollInput();
  players.forEach((pl,k)=>{
    if(pl.out||pl.finished) return;
    if(!pl.alive){ pl.deathT+=dt; if(pl.deathT>1.35) respawnPlayer(pl); return; }
    if(pl.hidden) return;
    if(k===0){
      if(mouseDV||mouseDU){ pl.vv+=mouseDV; pl.vu+=mouseDU; mouseDV=0; mouseDU=0; }
      marblePhysics(pl,dt,inpV*ACC,inpU*ACC);
    } else marblePhysics(pl,dt,inp2V*ACC,inp2U*ACC);
  });
  updateHazards(dt);
  if(steelie.active){
    if(steelie.alive){
      let av=0,au=0,best=null,bd=26;
      for(const pl of players) if(pl.alive&&!pl.out&&!pl.finished){
        const d=Math.hypot(pl.v-steelie.v,pl.u-steelie.u); if(d<bd){ bd=d; best=pl; } }
      if(best&&bd>0.01){ av=(best.v-steelie.v)/bd*11.5; au=(best.u-steelie.u)/bd*11.5; }
      marblePhysics(steelie,dt,av,au);
      const sp=Math.hypot(steelie.vv,steelie.vu);
      if(sp>8.5){ steelie.vv*=8.5/sp; steelie.vu*=8.5/sp; }
    } else {
      steelie.aiRespawnT-=dt;
      const near=racersRacing().find(pl=>pl.alive);
      if(steelie.aiRespawnT<=0&&near){
        steelie.alive=true; steelie.v=Math.max(2,Math.min(CV-2,near.v+6)); steelie.u=Math.min(CU-6,near.u+7);
        const sh=groundH(steelie.v,steelie.u);
        if(isNaN(sh)){ steelie.aiRespawnT=1; steelie.alive=false; }
        else { steelie.z=sh+1.5; steelie.grounded=false; steelie.vz=0; steelie.vv=0; steelie.vu=0; steelie.dropIn=true; }
      }
    }
  }
  if(numPlayers===2&&player.alive&&player2.alive&&!player.hidden&&!player2.hidden) collideMarbles(player,player2);
  for(const pl of players) if(pl.alive&&!pl.hidden&&steelie.active&&steelie.alive) collideMarbles(pl,steelie);
  // catch-up rule: trailing live player warped to leader's checkpoint.
  // It costs the trailing player a second, so it MUST have a cooldown — without one
  // it re-fired every physics step and drained a full minute in about seven seconds.
  if(catchupCD>0) catchupCD-=dt;
  if(numPlayers===2&&catchupCD<=0&&!player.out&&!player2.out&&!player.finished&&!player2.finished&&player.alive&&player2.alive){
    const dy=Math.abs((player.v*AXy+player.u*AUy)-(player2.v*AXy+player2.u*AUy));
    if(dy>560){ catchupCD=3;
      const lead=player.u>player2.u?player:player2, trail=lead===player?player2:player;
      // offset to whichever side has ground, so the two do not overlap on arrival
      let tv=lead.lastSafe.v, off=0;
      for(const cand of [1.8,-1.8,2.6,-2.6,0]){
        if(!isNaN(groundH(lead.lastSafe.v+cand,lead.lastSafe.u))){ off=cand; break; } }
      trail.v=tv+off; trail.u=lead.lastSafe.u;
      const hh=groundH(trail.v,trail.u); trail.z=(isNaN(hh)?4:hh)+2.2;
      trail.vv=0; trail.vu=0; trail.vz=0; trail.grounded=false; trail.dropIn=true;
      trail.timeLeft=Math.max(1,trail.timeLeft-1); } }
  for(const pl of players){
    if(pl.out||pl.finished||!pl.alive) continue;
    if(pl.u>pl.maxU) pl.maxU=pl.u;
    if(Math.hypot(pl.vv,pl.vu)>1.2){ pl.moveAcc+=dt;
      if(pl.moveAcc>=1){ pl.moveAcc-=1; pl.score+=10; } }
    pl.safeT+=dt;
    const h2=groundH(pl.v,pl.u);
    if(pl.safeT>0.4&&pl.grounded&&Math.hypot(pl.vv,pl.vu)<7&&!inDyn(pl.v*GS,pl.u*GS)){ pl.safeT=0;
      const c=cellAt(pl.v*GS,pl.u*GS);
      if(c&&c.type===NORMAL){ let ok=true;
        for(const [dv,du] of [[0.9,0],[-0.9,0],[0,0.9],[0,-0.9]]){
          const hh=groundH(pl.v+dv,pl.u+du);
          if(isNaN(hh)||Math.abs(hh-(isNaN(h2)?0:h2))>0.8){ ok=false; break; } }
        // and never checkpoint on the lip of a drop: respawning there just feeds the
        // player straight back off the same edge, burning the whole clock in a loop
        if(ok) for(const ahead of [1.6,3.0]){
          if(isNaN(groundH(pl.v,pl.u+ahead))){ ok=false; break; } }
        if(ok) pl.lastSafe={v:pl.v,u:pl.u}; } }
    const c=cellAt(pl.v*GS,pl.u*GS);
    if(c&&c.type===GOAL&&pl.grounded&&!pl.finished){
      pl.finished=true; finishOrder.push(pl.pIdx);
      pl.carry=Math.max(0,pl.timeLeft)+(finishOrder.length===1&&numPlayers===2?5:0);
      if(finishOrder.length===1&&numPlayers===2) pl.score+=1000;
      pl.vv=0; pl.vu=0; Snd.goal(); }
  }
}

/* ---------- render ---------- */
function marbleScreen(m){ return { x:projX(m.v,m.u)+offX-camX, y:projY(m.v,m.u,m.z)+offY-camY-m.r*AZ*0.55 }; }
function addFloater(v,u,z,txt,col){ floaters.push({v,u,z,txt,col:col||'#ffcc33',t:0}); }
function updateCam(){
  const foc=players.filter(pl=>!pl.out&&!pl.finished&&pl.alive);
  const list=foc.length?foc:players.filter(pl=>!pl.out);
  const fv=list.length?list.reduce((a,p)=>a+p.v,0)/list.length:player.v;
  const fu=list.length?list.reduce((a,p)=>a+p.u,0)/list.length:player.u;
  const fz=list.length?list.reduce((a,p)=>a+p.z,0)/list.length:player.z;
  const px=projX(fv,fu)+offX, py=projY(fv,fu,fz)+offY;
  const tx=Math.max(0,Math.min(offW-640,px-320)), ty=Math.max(0,Math.min(offH-400,py-(FLIP?230:170)));
  if(!camInit){ camX=tx; camY=ty; camInit=true; }
  camX+=(tx-camX)*0.14; camY+=(ty-camY)*0.14;
}
/* Decor measured off the original: bright red tube arches with a lighter
   highlight along the top, and dark red chevrons painted on the floor. */
/* Round tube shading. Canvas cannot put a gradient ACROSS a stroke's width, so the
   cylinder is built from concentric passes: a dark rim, the body, then narrower and
   brighter strokes nudged toward the light. Two flat layers plus a hairline highlight
   read as a flat ribbon; this reads as round. */
function tube(g,path,hue){
  const [r0,g0,b0]=hex2rgb(hue);
  const layers=[[9.5,0.30,0,0],[8.2,0.58,0,0],[6.6,0.95,-0.3,-0.3],
                [2.6,1.06,-0.9,-0.9],[1.0,1.45,-1.5,-1.5]];
  for(const [w,k,dx,dy] of layers){
    g.save(); g.translate(dx,dy);
    g.strokeStyle=rgb17(r0*k,g0*k,b0*k); g.lineWidth=w; path(); g.stroke();
    g.restore();
  }
}
function archGate(g,ox,oy,v,u,span,hgt){
  // built in world space so it foreshortens with the projection, like the original's
  let SP=span||2.2; const HT=hgt||3.4;
  let hL=groundH(v-SP,u), hR=groundH(v+SP,u);
  while((isNaN(hL)||isNaN(hR))&&SP>0.6){   // shrink until both feet are on the course
    SP-=0.3; hL=groundH(v-SP,u); hR=groundH(v+SP,u); }
  if(isNaN(hL)||isNaN(hR)) return;
  const P=(vv,zz)=>[projX(vv,u)+ox, projY(vv,u,zz)+oy];
  const [lx,ly]=P(v-SP,hL), [ltx,lty]=P(v-SP,hL+HT);
  const [rx,ry]=P(v+SP,hR), [rtx,rty]=P(v+SP,hR+HT);
  const [cx,cy]=P(v,(hL+hR)/2+HT+0.55);
  const path=()=>{ g.beginPath(); g.moveTo(lx,ly); g.lineTo(ltx,lty);
    g.quadraticCurveTo(cx,cy,rtx,rty); g.lineTo(rx,ry); };
  g.lineCap='round'; g.lineJoin='round';
  tube(g,path,PAL.rail||'#dd3333');
  g.lineCap='butt'; g.lineJoin='miter';
}
/* Measured off rec/r1-last.png, the clearest capture of practice section 2: the painted
   arrows are a SINGLE LONG arrow with one head — not the twin chevrons we drew — laid
   along a grid axis, and the pair beside the centre structure CONVERGES (left one points
   down-right, right one points down-left), funnelling you back to the middle once past
   it. v0.49.0 had them angled the other way, outward. `len` is the shaft length in cells. */
/* A straight red tube handrail with a short post at its low end. Measured off
   rec/r1-last.png: the centre structure's raised platform carries one along each side,
   running parallel to the edge. Distinct from archGate — no span and no arch; earlier
   builds used arches here, which is why section 2 read wrong beside the structure. */
function railing(g,ox,oy,v0,u0,v1,u1,hgt){
  const h0=groundH(v0,u0), h1=groundH(v1,u1);
  if(isNaN(h0)||isNaN(h1)) return;
  const HT=hgt||1.5;
  const P=(vv,uu,zz)=>[projX(vv,uu)+ox, projY(vv,uu,zz)+oy];
  const [ax,ay]=P(v0,u0,h0+HT), [bx,by]=P(v1,u1,h1+HT), [px,py]=P(v0,u0,h0);
  g.lineCap='round'; g.lineJoin='round';
  tube(g,()=>{ g.beginPath(); g.moveTo(px,py); g.lineTo(ax,ay); g.lineTo(bx,by); },
       PAL.rail||'#dd3333');
  g.lineCap='butt'; g.lineJoin='miter';
}
function floorArrow(g,ox,oy,v,u,turn,len){
  const h=groundH(v,u); if(isNaN(h)) return;
  const px=projX(v,u)+ox, py=projY(v,u,h+0.04)+oy;
  const L=len||6.2, W=0.42, HW=1.05, HL=1.6;   // shaft length/half-width, head half-width/length
  g.save(); g.setTransform(AXx,AXy,AUx,AUy,px,py);
  if(turn) g.rotate(turn);
  const shape=()=>{ g.beginPath();
    g.moveTo(-L/2,-W); g.lineTo(L/2-HL,-W); g.lineTo(L/2-HL,-HW); g.lineTo(L/2,0);
    g.lineTo(L/2-HL,HW); g.lineTo(L/2-HL,W); g.lineTo(-L/2,W);
    g.closePath(); };
  const [ar,ag,ab]=hex2rgb(PAL.arrow||'#aa2222');
  const wear=g.createLinearGradient(-L/2,0,L/2,0);
  wear.addColorStop(0,   `rgba(${ar},${ag},${ab},.60)`);   // worn thin at the tail
  wear.addColorStop(0.38,`rgba(${ar},${ag},${ab},.88)`);
  wear.addColorStop(1,   `rgba(${ar},${ag},${ab},.82)`);
  g.strokeStyle='rgba(0,0,0,.20)'; g.lineWidth=0.16; g.lineJoin='round';
  shape(); g.stroke();                                     // soft seam into the floor
  g.fillStyle=wear; shape(); g.fill();

}
function drawMarbleG(g,m){
  const p=marbleScreen(m); const r=m.r*AXx;   // scale with the projection, not a constant
  const h=groundH(m.v,m.u);

  // main cue that it is airborne. The old one was a hard flat ellipse.
  if(!isNaN(h)){ const sy=projY(m.v,m.u,h)+offY-camY;
    const air=Math.max(0,m.z-h), k=Math.max(0.30,1-air*0.10);
    g.save(); g.globalAlpha=Math.max(0.12,0.55-air*0.05);

    g.fillStyle='#0b0b10'; g.beginPath();
    g.ellipse(projX(m.v,m.u)+offX-camX+2,sy-1,r*0.95*k,r*0.44*k,0,0,Math.PI*2); g.fill();
    g.restore(); }

  body.addColorStop(0.82,shadeHex(C[0],0.52)); body.addColorStop(1,C[1]);

  g.fillStyle=relit; g.beginPath(); g.arc(p.x,p.y,r,0,Math.PI*2); g.fill();

/* The Amiga marble carries chunky surface patches that visibly turn as it rolls
   (measured off the original sprite: red ball, olive-yellow blocks). Patches live
   on a unit sphere and are rotated about the axis perpendicular to travel. */
const SPIN_PATCHES=[[0,0,1],[0.72,0.16,0.68],[-0.62,0.38,0.68],[0.1,-0.8,0.59],[-0.15,0.86,0.49],[0.86,-0.42,0.29]];
function drawSpinPattern(g,m,cx,cy,r){
  const col=(m.kind==='steelie')?'#8899aa':(m.pIdx===1?'#99aaff':'#aaaa00');
  const a=m.spin||0, tx=(m.spinX===undefined?1:m.spinX), ty=(m.spinY===undefined?0:m.spinY);
  const ax=-ty, ay=tx, az=0;                    // roll axis: perpendicular to travel
  const ca=Math.cos(a), sa=Math.sin(a);
  g.save();
  g.beginPath(); g.arc(cx,cy,r*0.97,0,Math.PI*2); g.clip();
  for(const [px0,py0,pz0] of SPIN_PATCHES){
    // Rodrigues rotation of the patch centre about (ax,ay,az)
    const dot=ax*px0+ay*py0+az*pz0;
    const rx=px0*ca+(ay*pz0-az*py0)*sa+ax*dot*(1-ca);
    const ry=py0*ca+(az*px0-ax*pz0)*sa+ay*dot*(1-ca);
    const rz=pz0*ca+(ax*py0-ay*px0)*sa+az*dot*(1-ca);
    if(rz<=0.06) continue;                       // on the far side
    const sx=cx+rx*r, sy=cy+ry*r, sz=Math.sqrt(Math.max(0.06,rz));
    g.fillStyle=col; g.globalAlpha=Math.min(1,0.35+rz);
    // blocky patches, as on the original sprite
    const pw=r*0.34*sz, ph=r*0.40*sz, ang=Math.atan2(ry,rx);
    g.translate(sx,sy); g.rotate(ang*0.35);
    g.fillRect(-pw/2,-ph/2,pw,ph);
    g.rotate(-ang*0.35); g.translate(-sx,-sy);
  }
  g.globalAlpha=1; g.restore();
}
function redrawFront(g,m){
  const mu=Math.floor(m.u*GS), px=projX(m.v,m.u)+offX;
  const W=4*GS;   // 4 WORLD units ahead, expressed in cells
  const u0=Math.max(0,FLIP?mu-W:mu+1), u1=Math.min(CU-1,FLIP?mu-1:mu+W);
  for(let u=u0;u<=u1;u++)for(let v=0;v<CV;v++){ const c=cells[u]&&cells[u][v]; if(!c) continue;
    const cx=pX(v+0.5,u)+offX; if(Math.abs(cx-px)>90) continue;
    const ch=Math.max(c.h00,c.h10,c.h01,c.h11); if(ch<=m.z+0.2) continue;
    g.save(); g.translate(-camX,-camY);
    if(inDyn(v,u)){ const dc=dynCellAt(v,u); if(dc) drawCellC(g,v,u,offX,offY,dc); }
    else drawCell(g,v,u,offX,offY);

function hillCellC(v,u){ const c=cells[u][v]; if(!c) return null;

          h01:c.h01+hillsAt(v/GS,(u+1)/GS),h11:c.h11+hillsAt((v+1)/GS,(u+1)/GS),
          type:c.type,tint:c.tint,tex:c.tex}; }

function drawMuncher(g,h){

function drawHammer(g,h){

function drawPiston(g,h){
  const gh=groundH(h.v,h.u); if(isNaN(gh)) return;
  const ph=h.phase, ext=ph<0.1?1:(ph<0.5?1-(ph-0.1)/0.4:(ph>1.9?(ph-1.9)/0.3*0.25:0));

function hudNum(g,str,x,y,scale,color,align){
  const cw=(8+1)*scale, w=String(str).length*cw;
  let px=align==='right'?x-w:(align==='center'?x-w/2:x);
  g.fillStyle=color;
  for(const ch of String(str)){
    const gl=HUD_FONT[ch];
    if(gl){ for(let r=0;r<8;r++){ const row=gl[r];
      let c=0;
      while(c<8){                       // run-length the row so we fill fewer rects

          g.fillRect(px+c*scale, y+r*scale, (e-c)*scale, scale); c=e; }
        else c++;

function menuFit(g,str,x,y,scale,col,align,maxW){
  // the measured font is proportional and wider than Courier at the same nominal
  // size, so long strings overflow: step the scale down until it fits
  const W=maxW||600;
  let sc=scale;
  while(sc>1){
    let wdt=0;
    for(const ch of str){ if(ch===' '){ wdt+=4*sc; continue; }
      const gl=MENU_FONT[ch]; wdt+=(gl?gl[0].length+1:7)*sc; }
    if(wdt<=W) break;
    sc--;
  }
  return menuText(g,str,x,y,sc,col,align);
}
function menuText(g,str,x,y,scale,col,align){
  // Draw with the measured letterforms. A few glyphs (N, b, F, K) never appear on
  // the reference screen, so those characters fall back individually rather than
  // dropping the whole line back to Courier.
  // Match Courier's CAP HEIGHT to the pixel font's: caps are ~0.63 of font size,
  // and our glyphs stand 8 rows tall, so fontsize = 8*scale/0.63.
  const FB=Math.round(scale*12.7);
  let wdt=0;
  for(const ch of str){ if(ch===' '){ wdt+=4*scale; continue; }
    const gl=MENU_FONT[ch]; wdt+=(gl?gl[0].length+1:6)*scale; }
  let px=align==='center'?x-wdt/2:(align==='right'?x-wdt:x);
  g.fillStyle=col;
  for(const ch of str){
    if(ch===' '){ px+=4*scale; continue; }
    const gl=MENU_FONT[ch];
    if(!gl){                                  // unknown glyph: draw it the old way
      g.font=`900 ${FB}px "Courier New",monospace`; g.textAlign='left'; g.textBaseline='alphabetic';
      g.fillText(ch,px,y+8*scale); px+=7*scale; continue; }
    for(let r=0;r<gl.length;r++){ const row=gl[r];
      let c=0;
      while(c<row.length){
        if(row[c]==='#'){ let e=c; while(e<row.length&&row[e]==='#') e++;
          g.fillRect(px+c*scale, y+r*scale, (e-c)*scale, scale); c=e; }
        else c++;
      } }
    px+=(gl[0].length+1)*scale;
  }
  return true;
}
function spaced(g,str,x,y,size,col,align){   // the original letter-spaces its text
  g.font=`900 ${size}px "Courier New",monospace`; g.textBaseline='middle';
  const gap=size*0.78, w=str.length*gap;
  let px=align==='center'?x-w/2:(align==='right'?x-w:x);
  g.textAlign='left';
  for(const ch of str){ if(ch!==' '){ g.fillStyle=col; g.fillText(ch,px,y); } px+=gap; }
  return w;
}

  g.strokeStyle='#330000'; g.lineWidth=9; g.strokeText('MADNESS',320,186);
  g.fillStyle=go; g.fillText('MADNESS',320,186);
  text(g,'A M I G A   T R I B U T E',320,232,13,'#99aaee');
  text(g,'clean-room recreation · v'+VERSION+' · all six races',320,258,12,'#667788');
  if(Math.floor(demoT*1.6)%2===0) text(g,'SPACE / CLICK — 1 PLAYER      press 2 — 2 PLAYERS',320,288,16,'#ffcc33');
  text(g,'HIGH SCORES',320,316,12,'#99aaee');
  for(let i=0;i<5;i++){ const h=hiscores[i];
    text(g,(i+1)+'.  '+h.n+'  '+String(h.s).padStart(6,' '),320,332+i*13,12,i===0?'#ffcc33':'#ccccff'); }
  text(g,'P1: arrows + mouse · P2: WASD · GOAL before the clock dies — big drops smash the marble',320,394,10.5,'#8899bb');
}

/* ---------- main loop ---------- */
let last=performance.now(), acc=0, autoStep=true;
const RACE_TRACKS=['practice','beginner','intermediate','aerial','silly','ultimate'];
let lastMusicKey='';
function updateMusic(){
  let key='';
  if(state==='title') key='title';
  else if(state==='ready'||state==='race'||state==='goal') key=RACE_TRACKS[raceIdx]||'';
  else if(state==='ending') key='ending';
  if(key!==lastMusicKey){ lastMusicKey=key; if(key) Music.play(key); else Music.stop(); }
  Music.tempo=(state==='race'&&raceIdx===4)?1+Math.min(0.6,raceT*0.025):1;
}
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.25) dt=0.25;
  if(autoStep){ acc+=dt; while(acc>=STEP){ physics(STEP); acc-=STEP; } }
  Snd.roll(Math.hypot(player.vv,player.vu),player.grounded&&player.alive&&state==='race');
  render(dt);
  requestAnimationFrame(frame);
}
loadRace(0); state='title';
requestAnimationFrame(frame);
console.log('[marble-madness] practice build v'+VERSION);

/* ---------- QA hooks ---------- */
if(QA){
  window.__qa={
    version:VERSION,
    get state(){ return state; }, get race(){ return raceIdx; },
    get pos(){ return {v:player.v,u:player.u,z:player.z}; },
    get vel(){ return {vv:player.vv,vu:player.vu,vz:player.vz}; },
    get steelie(){ return {active:steelie.active,alive:steelie.alive,v:steelie.v,u:steelie.u}; },
    get timeLeft(){ return player.timeLeft; }, get score(){ return player.score; }, get deaths(){ return deaths; },
    get carry(){ return player.carry; }, get lastDeath(){ return lastDeath; },
    get p2(){ return {active:player2.active,v:player2.v,u:player2.u,t:player2.timeLeft,score:player2.score,
      finished:player2.finished,out:player2.out,alive:player2.alive}; },
    get finishOrder(){ return finishOrder.slice(); },
    get music(){ return {track:Music.current,tempo:+Music.tempo.toFixed(2)}; },
    get hiscores(){ return hiscores.map(h=>h.n+':'+h.s); },
    forceEnd(){ player.score=99999; state='ending'; stateT=3; },
    enterInitials(str){ if(state!=='initials') return false;
      entryName=String(str).toUpperCase().slice(0,3); commitEntry(); return true; },
    beginEntry(){ queueScoreEntry(); return state; },
    start2(){ startGame(2); state='race'; },
    input2(gv,gu){ qaInp2=(gv===null)?null:{v:gv,u:gu}; },
    warp2(v,u){ player2.v=v; player2.u=u; const h=groundH(v,u); player2.z=isNaN(h)?6:h;
      player2.vv=0;player2.vu=0;player2.vz=0;player2.grounded=!isNaN(h); },
    warpSteelie(v,u,vv,vu){ steelie.active=true; steelie.alive=true; steelie.v=v; steelie.u=u;
      const h=groundH(v,u); steelie.z=isNaN(h)?6:h; steelie.vv=vv||0; steelie.vu=vu||0;
      steelie.vz=0; steelie.grounded=!isNaN(h); steelie.dropIn=false; },
    start(){ startGame(1); state='race'; },
    loadRace(i){ for(const pl of players) pl.carry=0; loadRace(i); state='race'; },
    // the hooks above skip the pre-race presentation so bots don't burn steps on it;
    // this one keeps it, for checking the banner and the clock filling in
    ready(i){ for(const pl of players) pl.carry=0; loadRace(i|0); return state; },
    warp(v,u){ player.v=v; player.u=u; const h=groundH(v,u); player.z=isNaN(h)?6:h;
      player.vv=0;player.vu=0;player.vz=0;player.grounded=!isNaN(h); },
    input(gv,gu){ qaInp=(gv===null)?null:{v:gv,u:gu}; },
    lift(dz){ player.z+=dz; player.grounded=false; player.vz=0; player.dropIn=false; },
    hold(dir,on){ keys[dir]=!!on; },
    setTime(t){ for(const pl of players) pl.timeLeft=t; },
    get hazards(){ return hazards.map(h=>{
      // rect-based hazards (tube, catapult) carry no v/u — report their centre
      const rv=h.rect?(h.rect.v0+h.rect.v1)/2:null, ru=h.rect?(h.rect.u0+h.rect.u1)/2:null;
      return {t:h.type,v:+(h.v??h.cv??rv??0).toFixed(1),u:+(h.u??h.cu??ru??0).toFixed(1),
              val:h.val,taken:h.taken,rect:!!h.rect}; }); },
    get hidden(){ return player.hidden; },
    step(ms){ autoStep=false; const n=Math.round(ms/1000/STEP); for(let i=0;i<n;i++) physics(STEP); render(STEP*n); },
    auto(on){ autoStep=on; last=performance.now(); acc=0; },
    get options(){ return {...OPT, raceTime:RACES.map((r,i)=>raceTime(i))}; },
    openOptions(){ state='options'; stateT=0; },
    menuAt(x,y){ menuMX=x; menuMY=y; },
    menuClick(){ optionsClick(); },
    setDifficulty(d){ OPT.difficulty=d%8; },
    ground(v,u){ const h=groundH(v,u); return isNaN(h)?null:+h.toFixed(3); },
    turbo(on){ turbo=!!on; }
  };
}
</script>
