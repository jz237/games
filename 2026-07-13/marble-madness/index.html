<script>
"use strict";
/* MARBLE MADNESS — practice build. Clean-room recreation: all code + art original.
   Engine: axonometric per-cell heightfield, painter-order prerender, fixed-step physics,
   dynamic (animated) wave bands, multi-race chain with time carryover, Steelie rival AI. */
const VERSION = '0.39.0';
const QA = new URLSearchParams(location.search).has('qa');

/* ---------- projection basis (trimetric-ish; tune vs reference later) ---------- */
let AXx = 14, AXy = 7;        // +v (across): 2:1 like the arcade (measured from reference)
let AUx = -7, AUy = 10;       // +u (down course): steep down-left
const AZ  = 16;               // pixels per height unit
let DET = AXx*AUy - AUx*AXy;
let FLIP = false;             // true when +u renders up-screen (Silly race)
const BASIS_STD={axx:14,axy:7,aux:-7,auy:10}, BASIS_FLIP={axx:14,axy:7,aux:7,auy:-10};
function setBasis(b){ AXx=b.axx; AXy=b.axy; AUx=b.aux; AUy=b.auy;
  DET=AXx*AUy-AUx*AXy; FLIP=AUy<0; }
function projX(v,u){ return v*AXx + u*AUx; }
function projY(v,u,z){ return v*AXy + u*AUy - z*AZ; }
function screenToGrid(sx,sy){ return { dv:(AUy*sx - AUx*sy)/DET, du:(-AXy*sx + AXx*sy)/DET }; }

/* ---------- course builder ---------- */
const NORMAL=0, GOAL=1;
const ABYSS=-2.5;
let CV=0, CU=0, cells=null, dynBand=null, decorFn=null, simT=0;
function newGrid(cv,cu){ CV=cv; CU=cu; dynBand=null; decorFn=null; hazards=[];
  cells=new Array(CU); for(let u=0;u<CU;u++) cells[u]=new Array(CV).fill(null); }
function put(v,u,h00,h10,h01,h11,o){ cells[u][v]={h00,h10,h01,h11,type:(o&&o.type)||NORMAL,tint:(o&&o.tint)||null,tex:(o&&o.tex)||null,dots:!!(o&&o.dots)}; }
function carve(v0,u0,v1,u1){ for(let u=u0;u<=u1;u++)for(let v=v0;v<=v1;v++) cells[u][v]=null; }
function slab(v0,u0,v1,u1,h,o){ for(let u=u0;u<=u1;u++)for(let v=v0;v<=v1;v++) put(v,u,h,h,h,h,o); }
function rampU(v0,u0,v1,u1,hTop,hBot,o){ const n=(u1+1-u0);
  for(let u=u0;u<=u1;u++){ const a=hTop+(hBot-hTop)*(u-u0)/n, b=hTop+(hBot-hTop)*(u+1-u0)/n;
    for(let v=v0;v<=v1;v++) put(v,u,a,a,b,b,o); } }
function rampV(v0,u0,v1,u1,hL,hR,o){ const n=(v1+1-v0);
  for(let v=v0;v<=v1;v++){ const a=hL+(hR-hL)*(v-v0)/n, b=hL+(hR-hL)*(v+1-v0)/n;
    for(let u=u0;u<=u1;u++) put(v,u,a,b,a,b,o); } }
function waves(v0,u0,v1,u1,hTop,hBot,amp,perV,perU,o){
  const f=(v,u)=>{ const t=(u-u0)/(u1+1-u0);
    const eased=Math.min(1,Math.min(u-u0,(u1+1)-u)/2.2);
    return hTop+(hBot-hTop)*t + amp*Math.max(0,eased)*Math.sin(v*Math.PI*2/perV)*Math.sin(u*Math.PI*2/perU); };
  for(let u=u0;u<=u1;u++)for(let v=v0;v<=v1;v++) put(v,u,f(v,u),f(v+1,u),f(v,u+1),f(v+1,u+1),o);
}
function pyramid(v,u,base,peak,o){ const oo=o||{};
  put(v,u,  base,base,base,peak,oo); put(v+1,u,  base,base,peak,base,oo);
  put(v,u+1,base,peak,base,base,oo); put(v+1,u+1,peak,base,base,base,oo); }
/* animated band: cells must ALSO be authored (static shape ~ t=0) for prerender bounds */
function dynWaves(v0,u0,v1,u1,hTop,hBot,amp,perV,perU,speed,o){
  dynBand={v0,u0,v1,u1,hTop,hBot,amp,perV,perU,speed,tint:(o&&o.tint)||null,tex:(o&&o.tex)||null};
  waves(v0,u0,v1,u1,hTop,hBot,amp,perV,perU,o);
}
function dynH(v,u,t){ const b=dynBand;
  const tt=(u-b.u0)/(b.u1+1-b.u0);
  const easeU=Math.min(1,Math.min(u-b.u0,(b.u1+1)-u)/2.2);
  const easeV=Math.min(1,Math.min(v-b.v0,(b.v1+1)-v)/1.2);
  const eased=Math.max(0,Math.min(easeU,easeV));
  return b.hTop+(b.hBot-b.hTop)*tt + b.amp*eased*Math.sin(v*Math.PI*2/b.perV + t*b.speed*0.7)*Math.sin(u*Math.PI*2/b.perU + t*b.speed);
}
function inDyn(v,u){ return dynBand && v>=dynBand.v0 && v<dynBand.v1+1 && u>=dynBand.u0 && u<dynBand.u1+1; }
function cellAt(v,u){ const iu=Math.floor(u), iv=Math.floor(v);
  if(iu<0||iu>=CU||iv<0||iv>=CV) return null; return cells[iu][iv]; }
let hazards=[];              // per-race entities: muncher | acid | hill | tube
function hillsAt(v,u){ let dh=0;
  for(const h of hazards){ if(h.type!=='hill') continue;
    const dv=v-h.cv, du=u-h.cu, q=(dv*dv+du*du)/(2*h.sig*h.sig);
    if(q<9) dh+=h.amp*Math.exp(-q); }
  return dh; }
function groundH(v,u){ const c=cellAt(v,u); if(!c) return NaN;
  let base;
  if(inDyn(v,u)){
    const iv=Math.floor(v), iu=Math.floor(u), fv=v-iv, fu=u-iu;
    const a=dynH(iv,iu,simT)*(1-fv)+dynH(iv+1,iu,simT)*fv;
    const b=dynH(iv,iu+1,simT)*(1-fv)+dynH(iv+1,iu+1,simT)*fv;
    base=a*(1-fu)+b*fu;
  } else {
    const fv=v-Math.floor(v), fu=u-Math.floor(u);
    base=(c.h00*(1-fv)+c.h10*fv)*(1-fu) + (c.h01*(1-fv)+c.h11*fv)*fu;
  }
  return base+hillsAt(v,u); }

/* ---------- races ---------- */
function buildPractice(){ newGrid(24,88);
  const RED={tint:'#b34852'}, DARK={tint:'#79809f'}, GRID={tex:'grid'};
  /* Opening plain rebuilt from the real Amiga screen (iteration 25): a broad
     FLAT checkerboard plain with a sawtooth far edge, twin white-tipped peaks
     on a stepped centre island, and a raised diamond platform either side. */
  slab(3,0,20,13,12,GRID);
  for(let v=3;v<=20;v++){                       // three-peak sawtooth far edge
    const t=((v-3)%6)/6, cut=Math.round(4.5*Math.abs(t-0.5)*2);
    if(cut>0) carve(v,0,v,cut-1);
  }
  slab(4,6,7,8,12.9,GRID);                      // left diamond platform (under the arch)
  slab(16,6,19,8,12.9,GRID);                    // right diamond platform
  slab(9,8,14,11,12.7,GRID);                    // centre island base
  slab(10,9,13,10,13.4,GRID);                   // its stepped tier
  pyramid(10,9,13.4,17.6,{tint:'#e2e2e2'});     // twin white-tipped peaks
  pyramid(12,9,13.4,17.6,{tint:'#e2e2e2'});
  rampU(3,14,20,19,12,10,GRID);
  slab(3,20,20,27,10);
  pyramid(5,21,10,12.2); pyramid(17,21,10,12.2);
  slab(8,22,15,24,12.6,RED);
  slab(10,22,11,24,10);  slab(13,22,14,24,10);
  slab(8,22,8,24,12.6,RED); slab(12,22,12,24,12.6,RED); slab(15,22,15,24,12.6,RED);
  waves(3,28,20,43,10,5,0.6,6,8,GRID);
  rampU(3,44,20,50,5,4);
  slab(16,45,19,49,5.6,RED);
  slab(14,51,17,51,4,DARK);
  slab(3,51,13,51,5,DARK);
  rampV(4,52,17,56,2.5,4,DARK);
  slab(4,57,7,57,2.5,DARK);
  slab(8,57,17,57,4.8,DARK);
  rampV(4,58,17,62,2.5,1,DARK);
  slab(14,63,17,63,1,DARK);
  slab(3,63,13,63,3.6,DARK);
  slab(3,52,3,63,6,DARK); slab(18,52,18,63,6,DARK);
  rampU(3,64,18,72,1,0.5);
  slab(19,64,19,72,3); slab(2,64,2,72,3);
  rampU(2,73,13,77,0.5,0);
  slab(2,78,13,82,0);
  slab(3,78,12,79,0,{type:GOAL});
  for(const [bv,val] of [[3.5,3],[6.5,4],[9.5,5],[12.5,6]])
    hazards.push({type:'bonus',v:bv,u:76.3,val,taken:false});
  slab(14,73,14,83,2.5); slab(1,73,1,83,2.5); slab(2,83,13,83,2.5);
  decorFn=(g,ox,oy)=>{
    g.strokeStyle='rgba(240,244,255,.85)'; g.lineWidth=2.5; g.setLineDash([8,6]); g.beginPath();
    for(let i=0;i<=30;i++){ const v=3.4+(20.4-3.4)*i/30; const h=groundH(v,8);
      const x=projX(v,8)+ox, y=projY(v,8,isNaN(h)?12:h+0.03)+oy;
      if(i===0) g.moveTo(x,y); else g.lineTo(x,y); }
    g.stroke(); g.setLineDash([]);
    // red tube arch gates flanking the course, as on the original
    for(const [av,au] of [[5.5,8],[17.5,8],[5.5,33],[17.5,33],[5.5,66],[15.5,66]]) archGate(g,ox,oy,av,au);
    // painted arrows on the floor pointing down-course
    for(const [av,au] of [[11.5,12],[11.5,26],[6.5,38],[16.5,38],[11.5,58],[8,70]]) floorArrow(g,ox,oy,av,au);
    for(const [cv,cu] of [[10.5,53.5],[10.5,55.5],[10.5,59],[10.5,61]]){
      const h=groundH(cv,cu); if(isNaN(h)) continue;
      const px=projX(cv,cu)+ox, py=projY(cv,cu,h+0.05)+oy;
      g.save(); g.setTransform(AXx,AXy,AUx,AUy,px,py);
      g.strokeStyle='rgba(255,255,255,.75)'; g.lineWidth=0.16;
      const dir=(cu<57)?-1:1;
      g.beginPath(); g.moveTo(dir*0.5,-0.4); g.lineTo(-dir*0.3,0); g.lineTo(dir*0.5,0.4); g.stroke();
      g.restore(); }
    goalText(g,8,75.6,0.28,ox,oy);
  };
}
function buildBeginner(){ newGrid(26,110);
  const GRID={tex:'grid'}, PINK={tint:'#c95f9d'}, TEAL={tex:'grid',tint:'#79b6b9'};
  // start plateau with box obstacles
  slab(3,0,22,8,14,GRID);
  slab(5,2,7,3,15.2,GRID); slab(16,4,18,5,15.2,GRID); slab(10,6,11,7,15.2,GRID);
  // terraces with offset ramps (fall risk at edges)
  slab(3,9,22,9,14,GRID);
  rampU(6,10,9,11,14,12); slab(3,12,22,12,12,GRID); slab(3,10,5,11,12,GRID); slab(10,10,22,11,12,GRID);
  rampU(16,13,19,14,12,10); slab(3,15,22,15,10,GRID); slab(3,13,15,14,10,GRID); slab(20,13,22,14,10,GRID);
  // split level: main path + side platform over void channel
  slab(3,16,12,24,10,GRID);
  slab(15,16,22,24,10,GRID);
  slab(13,18,14,24,10,GRID);                       // bridge runs to the channel end
  // pyramid zone (reference map shows green munchers here)
  slab(3,25,22,31,10,GRID);
  pyramid(6,26,10,12); pyramid(12,26,10,12); pyramid(18,26,10,12);
  hazards.push({type:'muncher',v:9,u:27.5,homeV:9,homeU:27.5,phase:0,state:'idle',hopT:0,tv:9,tu:27.5,docile:true});
  hazards.push({type:'muncher',v:13,u:30,homeV:13,homeU:30,phase:0.9,state:'idle',hopT:0,tv:13,tu:30,docile:true});
  // narrow to right-side channel, then pink slide down
  slab(14,32,21,38,10,GRID);
  for(let su=39;su<=46;su++){ // curved pink slide: center bulges right then returns
    const t=(su-39)/7, c=17.5+2.2*Math.sin(t*Math.PI);
    const hT=10+(su-39)*(4-10)/8, hB=10+(su-38)*(4-10)/8;
    const v0=Math.round(c-2.5), v1=Math.round(c+2.5);
    rampU(v0,su,v1,su,hT,hB,PINK);
    slab(v0-1,su,v0-1,su,hT+2,PINK); slab(v1+1,su,v1+1,su,hT+2,PINK);
  }
  // lower deck, twin narrow bridges over the big void
  slab(3,47,22,56,4,GRID);
  // pink tunnel-house: drop in, come out past the bridges (the map's doorway shortcut)
  slab(3,48,6,51,6.4,{tint:'#c95f9d'});
  slab(4,48,5,48,4,GRID);
  carve(4,49,5,50);
  hazards.push({type:'tube',rect:{v0:4,v1:6,u0:49,u1:51},exit:{v:12.5,u:62},busyT:0});
  rampU(5,57,6,60,4,3); rampU(17,57,18,60,4,3);           // two 2-wide bridges
  slab(3,61,22,64,3,GRID);
  // steelie zone with a catapult flinger (map shows pink catapults here)
  slab(3,65,22,74,3,GRID);
  slab(8,68,9,69,4.2,GRID); slab(15,71,16,72,4.2,GRID);
  slab(11,66,13,67,3.02,{tex:'grid',tint:'#d8b04a'});
  hazards.push({type:'catapult',rect:{v0:11,v1:14,u0:66,u1:68},launch:{vv:0,vu:8.5,vz:5.5},snap:{v:12.5,u:67},busyT:0});
  // descent to the waves
  rampU(3,75,22,80,3,1.2,GRID);
  slab(3,81,22,82,1.2,GRID);
  // ANIMATED wave floor with central pit
  dynWaves(3,83,22,98,1.2,0.6,0.5,6,7,2.2,TEAL);
  for(let cu=86;cu<=93;cu++)for(let cvv=9;cvv<=16;cvv++)
    if(Math.hypot(cvv+0.5-13,cu+0.5-90)<2.4) carve(cvv,cu,cvv,cu);
  // goal apron
  rampU(3,99,22,102,0.6,0.2);
  slab(3,103,22,106,0.2);
  slab(4,104,21,105,0.2,{type:GOAL});
  slab(2,99,2,107,2.2); slab(23,99,23,107,2.2); slab(3,107,22,107,2.2);
  decorFn=(g,ox,oy)=>{ goalText(g,12.5,101.2,0.45,ox,oy); };
}
function buildIntermediate(){ newGrid(26,100);
  const CHK={tex:'check',tint:'#c98a52'}, CHKD={tex:'check',tint:'#a06a3c'}, PINK={tint:'#c95f9d'}, GRN={tint:'#5fae62'};
  // twin start spurs (1P uses left) merging onto a deck
  slab(4,0,8,4,14,CHK); slab(17,0,21,4,14,CHK);
  rampU(4,5,8,8,14,12,CHK); rampU(17,5,21,8,14,12,CHK);
  slab(3,9,22,14,12,CHK);
  // mesa maze: raised blocks over the deck, channels between
  slab(3,15,22,30,12,CHK);
  slab(4,16,8,19,14,CHKD); slab(12,16,16,18,14,CHKD); slab(19,16,22,20,14,CHKD);
  slab(3,22,7,26,14,CHKD); slab(11,21,15,25,14,CHKD); slab(18,23,22,27,14,CHKD);
  hazards.push({type:'muncher',v:9.5,u:20,homeV:9.5,homeU:20,phase:0,state:'idle',hopT:0,tv:9.5,tu:20});
  hazards.push({type:'muncher',v:16.5,u:27,homeV:16.5,homeU:27,phase:1.4,state:'idle',hopT:0,tv:16.5,tu:27});
  // acid gauntlet
  slab(3,31,22,38,12,CHK);
  for(const [av,au,dv,du] of [[6,33,3.1,1.3],[12,35,-2.6,1.7],[18,33,2.2,-1.5],[9,37,-2.9,-1.2]])
    hazards.push({type:'acid',v:av,u:au,dv,du,zone:{v0:4,v1:21,u0:31.5,u1:37.5},r:1.05,wob:Math.random()*6});
  // split descent: left ramp down, right balcony with pink drop tube
  rampU(3,39,12,46,12,7,CHK);
  slab(13,39,22,46,12,CHK);
  slab(15,40,18,43,12.01,PINK);
  carve(16,41,17,42);
  hazards.push({type:'tube',rect:{v0:16,v1:18,u0:41,u1:43},exit:{v:17,u:48},busyT:0});
  slab(3,47,22,54,7,CHK);
  // moving green hills zone
  rampU(3,55,22,57,7,5.5,CHK);
  slab(3,58,22,70,5.5,GRN);
  hazards.push({type:'hill',cv:7,cu:61,dV:2.2,dU:0,amp:2.1,sig:2.1,zone:{v0:4,v1:21,u0:59,u1:69}});
  hazards.push({type:'hill',cv:15,cu:64,dV:-1.8,dU:0.5,amp:2.3,sig:2.3,zone:{v0:4,v1:21,u0:59,u1:69}});
  hazards.push({type:'hill',cv:11,cu:67,dV:2.6,dU:-0.4,amp:1.8,sig:1.9,zone:{v0:4,v1:21,u0:59,u1:69}});
  // descent with two more acid pools
  rampU(3,71,22,78,5.5,3,CHK);
  for(const [av,au,dv,du] of [[8,74,2.4,1.1],[16,76,-2.2,0.9]])
    hazards.push({type:'acid',v:av,u:au,dv,du,zone:{v0:4,v1:21,u0:71.5,u1:77.5},r:1.0,wob:Math.random()*6});
  // final checkered ramp + goal
  rampU(3,79,22,86,3,1,CHK);
  slab(3,87,22,92,1,CHK);
  rampU(3,93,22,95,1,0.2,CHK);
  slab(3,96,22,99,0.2,CHK);
  slab(4,97,21,98,0.2,{type:GOAL});
  slab(2,93,2,99,2.2); slab(23,93,23,99,2.2); slab(3,99,22,99,2.4);
  decorFn=(g,ox,oy)=>{ goalText(g,12.5,94.6,0.6,ox,oy); };
}
function goalText(g,v,u,z,ox,oy){
  const t=document.createElement('canvas'); t.width=240; t.height=56; const tg=t.getContext('2d');
  tg.font='900 44px "Arial Black",Arial,sans-serif'; tg.textAlign='center'; tg.textBaseline='middle';
  tg.lineJoin='round'; tg.strokeStyle='#3a0d12'; tg.lineWidth=9; tg.strokeText('GOAL',120,30);
  tg.fillStyle='#e33049'; tg.fillText('GOAL',120,30);
  const cx=projX(v,u)+ox, cy=projY(v,u,z)+oy, sc=1/22, fu=FLIP?-1:1;
  g.setTransform(AXx*sc,AXy*sc,AUx*sc*fu,AUy*sc*fu,cx,cy); g.drawImage(t,-120,-28); g.setTransform(1,0,0,1,0,0);

function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }

function baseRGB(c){ if(c.tint) return hex2rgb(c.tint);

function topColor(c){
  const s=(c.h01+c.h11-c.h00-c.h10)/2; const [r,g,b]=baseRGB(c);
  const avgH=(c.h00+c.h10+c.h01+c.h11)/4;

    pl.v=R.start[0]+off; pl.u=R.start[1]; pl.z=groundH(pl.v,pl.u);
    if(isNaN(pl.z)){ pl.v=R.start[0]; pl.z=groundH(pl.v,pl.u); }
    pl.vv=0; pl.vu=0; pl.vz=0; pl.grounded=true; pl.alive=true; pl.dropIn=false; pl.hidden=false;
    pl.lastSafe={v:pl.v,u:pl.u}; pl.maxU=0; pl.finished=false;
    pl.timeLeft=raceTime(i)+pl.carry; });

let lastDeath=null;
const DEATH_MSG={shatter:'SMASHED!',fall:'OFF THE EDGE!',eaten:'GULPED!',dissolved:'DISSOLVED!',smashed:'HAMMERED!',sucked:'VACUUMED!'};

    else if(kind==='dissolved'){ Snd.sizzle(); const p=marbleScreen(m);
      for(let i=0;i<10;i++) shards.push({x:p.x,y:p.y+4,vx:(Math.random()*2-1)*60,vy:-Math.random()*90-20,r:1.5+Math.random()*2.5,t:0,col:'#7fd28a'}); }
    else if(kind==='eaten'){ Snd.gulp(); }

      for(let i=0;i<12;i++) shards.push({x:p.x,y:p.y,vx:(Math.random()*2-1)*150,vy:-Math.random()*120-20,r:2+Math.random()*3.5,t:0}); }

function respawnPlayer(pl){ pl.v=pl.lastSafe.v; pl.u=pl.lastSafe.u; const h=groundH(pl.v,pl.u);
  pl.z=(isNaN(h)?4:h)+2.2; pl.vv=0; pl.vu=0; pl.vz=0;
  pl.grounded=false; pl.alive=true; pl.dropIn=true; }

/* ---------- physics ---------- */
function marblePhysics(m,dt,accV,accU){
  const h=groundH(m.v,m.u);
  if(m.grounded){
    if(isNaN(h)){ m.grounded=false; }
    else {
      const e=0.28;
      const gv=(groundH(m.v+e,m.u)-groundH(m.v-e,m.u))/(2*e);
      const gu=(groundH(m.v,m.u+e)-groundH(m.v,m.u-e))/(2*e);
      const tb=(m.kind==='player')&&(m.pIdx===1?turbo2:turbo);
      const ta=tb?TURBO_ACC:1;
      m.vv+=(accV*ta-(isNaN(gv)?0:gv)*GRAV*0.55)*dt;
      m.vu+=(accU*ta-(isNaN(gu)?0:gu)*GRAV*0.55)*dt;
      const sp=Math.hypot(m.vv,m.vu);
      const lim=MAXSP*(tb?TURBO_SP:1)+Math.max(0,-(isNaN(gu)?0:gu))*4;
      const f=1/(1+FRICT*dt*0.32); m.vv*=f; m.vu*=f;
      if(sp>lim){ m.vv*=lim/sp; m.vu*=lim/sp; }
    }
  } else { m.vz-=GRAV*dt; }
  // rolling-without-slipping spin, used to turn the surface pattern
  {
    const sp=Math.hypot(m.vv,m.vu);
    if(sp>0.02){
      const dx=(m.vv*AXx+m.vu*AUx), dy=(m.vv*AXy+m.vu*AUy);
      const dl=Math.hypot(dx,dy)||1;
      m.spinX=dx/dl; m.spinY=dy/dl;
    }
    m.spin=(m.spin||0)+sp*dt/Math.max(0.2,m.r)*0.55;
  }
  // axis-separated wall checks
  let nv=m.v+m.vv*dt, nu=m.u+m.vu*dt;
  const h0=groundH(m.v,m.u);
  const pv=nv+Math.sign(m.vv)*m.r*0.6, hv=groundH(pv,m.u);
  const blockedV = m.grounded ? (!isNaN(hv)&&!isNaN(h0)&&hv-h0>0.55)
                              : (!isNaN(hv)&&hv>m.z+0.3);
  if(blockedV){ if(Math.abs(m.vv)>2&&m.kind==='player')Snd.clack(Math.abs(m.vv)); m.vv*=-0.38; nv=m.v; }
  const pu=nu+Math.sign(m.vu)*m.r*0.6, hu=groundH(m.v,pu);
  const blockedU = m.grounded ? (!isNaN(hu)&&!isNaN(h0)&&hu-h0>0.55)
                              : (!isNaN(hu)&&hu>m.z+0.3);
  if(blockedU){ if(Math.abs(m.vu)>2&&m.kind==='player')Snd.clack(Math.abs(m.vu)); m.vu*=-0.38; nu=m.u; }
  m.v=nv; m.u=nu;
  const h2=groundH(m.v,m.u);
  if(m.grounded){
    if(isNaN(h2)){ m.grounded=false; m.vz=0; }
    else if(h2 < m.z-0.09){ m.grounded=false; m.vz=Math.max(-3,(h2-m.z)*6); }
    else { m.z=h2; }
  }
  if(!m.grounded){
    const zPrev=m.z;
    m.z+=m.vz*dt;
    if(!isNaN(h2)&&m.z<=h2&&(zPrev>=h2-0.3||h2-m.z<1.4)){
      const impact=-m.vz;
      if(impact>14&&!m.dropIn){ m.z=h2; die(m,'shatter'); return; }
      m.z=h2; m.grounded=true; m.dropIn=false;
      if(impact>3.5){ m.vz=impact*0.18; m.grounded=false; m.z+=0.001; if(m.kind==='player')Snd.clack(impact*0.7); }
      else m.vz=0;
    }
    if(m.z<ABYSS-3.5){ die(m,'fall'); }
  }
}
function updateHazards(dt){
  for(const h of hazards){
    if(h.type==='acid'){
      h.v+=h.dv*dt; h.u+=h.du*dt; h.wob+=dt;
      if(h.v<h.zone.v0||h.v>h.zone.v1){ h.dv*=-1; h.v=Math.max(h.zone.v0,Math.min(h.zone.v1,h.v)); }
      if(h.u<h.zone.u0||h.u>h.zone.u1){ h.du*=-1; h.u=Math.max(h.zone.u0,Math.min(h.zone.u1,h.u)); }
      for(const pl of players) if(pl.alive&&!pl.hidden&&pl.grounded&&Math.hypot(pl.v-h.v,pl.u-h.u)<h.r+0.5)
        die(pl,'dissolved');
    } else if(h.type==='hill'){
      h.cv+=h.dV*dt; h.cu+=(h.dU||0)*dt;
      if(h.cv<h.zone.v0||h.cv>h.zone.v1){ h.dV*=-1; h.cv=Math.max(h.zone.v0,Math.min(h.zone.v1,h.cv)); }
      if(h.cu<h.zone.u0||h.cu>h.zone.u1){ h.dU*=-1; h.cu=Math.max(h.zone.u0,Math.min(h.zone.u1,h.cu)); }
    } else if(h.type==='muncher'){
      h.phase+=dt;
      if(h.state==='idle'){
        h.hopT+=dt;
        if(h.hopT>0.85){ h.hopT=0;
          let tv=h.homeV+Math.sin(h.phase*0.7)*1.6, tu=h.homeU+Math.cos(h.phase*0.5)*1.2;
          if(!h.docile){ let best=null,bd=7.5;
            for(const pl of players) if(pl.alive&&!pl.hidden){ const d=Math.hypot(pl.v-h.v,pl.u-h.u);
              if(d<bd){ bd=d; best=pl; } }
            if(best){ tv=best.v; tu=best.u; } }
          const dd=Math.hypot(tv-h.v,tu-h.u)||1, L=Math.min(1.7,dd);
          h.sv=h.v; h.su=h.u; h.tv=h.v+(tv-h.v)/dd*L; h.tu=h.u+(tu-h.u)/dd*L;
          h.state='hop'; h.hopK=0;
        }
      } else {
        h.hopK+=dt*2.7;
        const k=Math.min(1,h.hopK);
        h.v=h.sv+(h.tv-h.sv)*k; h.u=h.su+(h.tu-h.su)*k;
        if(k>=1){ h.state='idle';
          for(const pl of players) if(pl.alive&&!pl.hidden&&pl.grounded&&Math.hypot(pl.v-h.v,pl.u-h.u)<1.3)

        }
      }
    } else if(h.type==='hammer'){
      h.phase=(h.phase+dt)%1.7;

        h.hit=true;

            Math.hypot(pl.v-h.v,pl.u-h.u)<1.35) die(pl,'smashed'); }
        if(Math.hypot(player.v-h.v,player.u-h.u)<7) Snd.thud();

    } else if(h.type==='piston'){
      h.phase=(h.phase+dt)%2.2;
      if(h.phase<0.1&&!h.hit){ h.hit=true;
        for(const pl of players) if(pl.alive&&!pl.hidden&&Math.hypot(pl.v-h.v,pl.u-h.u)<1.35){
          const dv=pl.v-h.v||0.3, du=pl.u-h.u||0.3, d=Math.hypot(dv,du);

    } else if(h.type==='vacuum'){
      for(const pl of players) if(pl.alive&&!pl.hidden&&pl.grounded&&
        pl.v>=h.zone.v0&&pl.v<=h.zone.v1&&pl.u>=h.zone.u0&&pl.u<=h.zone.u1){
        const dv=h.v-pl.v, du=h.u-pl.u, d=Math.hypot(dv,du)||1;
        pl.vv+=dv/d*h.pull*dt; pl.vu+=du/d*h.pull*dt;

          pl.hidden=false; pl.grounded=false;

          pl.z+=0.15; Snd.boing(); }
      } else { for(const pl of players) if(pl.alive&&!pl.hidden&&pl.grounded&&
          pl.v>=h.rect.v0&&pl.v<=h.rect.v1&&pl.u>=h.rect.u0&&pl.u<=h.rect.u1){
          h.busyT=0.35; h.captive=pl; pl.hidden=true; pl.vv=0; pl.vu=0;

    } else if(h.type==='critter'){

      h.v+=h.dv*dt; h.u+=h.du*dt;
      if(h.v<h.zone.v0||h.v>h.zone.v1){ h.dv*=-1; h.v=Math.max(h.zone.v0,Math.min(h.zone.v1,h.v)); }
      if(h.u<h.zone.u0||h.u>h.zone.u1){ h.du*=-1; h.u=Math.max(h.zone.u0,Math.min(h.zone.u1,h.u)); }
      for(const pl of players) if(pl.alive&&!pl.hidden&&pl.grounded&&Math.hypot(pl.v-h.v,pl.u-h.u)<1.0){
        h.alive=false; h.splatT=0; pl.score+=h.pink?800:500; pl.timeLeft+=1; Snd.squish(); break; }
    } else if(h.type==='bonus'){
      if(!h.taken) for(const pl of players)
        if(pl.alive&&!pl.hidden&&pl.grounded&&Math.hypot(pl.v-h.v,pl.u-h.u)<0.95){
          h.taken=true; pl.score+=h.val*1000;

}
function collideMarbles(a,b){
  if(!a.alive||!b.alive||!a.active||!b.active) return;
  if(Math.abs(a.z-b.z)>1.6) return;
  const dv=b.v-a.v, du=b.u-a.u, d=Math.hypot(dv,du), rr=a.r+b.r-0.15;
  if(d<=0.0001||d>=rr) return;
  const nx=dv/d, ny=du/d, overlap=rr-d;
  const tm=a.mass+b.mass;
  a.v-=nx*overlap*(b.mass/tm); a.u-=ny*overlap*(b.mass/tm);
  b.v+=nx*overlap*(a.mass/tm); b.u+=ny*overlap*(a.mass/tm);
  const rel=(b.vv-a.vv)*nx+(b.vu-a.vu)*ny;
  if(rel<0){ const j=-(1.55)*rel/(1/a.mass+1/b.mass);
    a.vv-=j*nx/a.mass; a.vu-=j*ny/a.mass;
    b.vv+=j*nx/b.mass; b.vu+=j*ny/b.mass;
    if(Math.abs(rel)>2.5) Snd.thud(); }
}
function racersRacing(){ return players.filter(pl=>!pl.out&&!pl.finished); }
function physics(dt){
  if(state!=='race'||paused) return;
  simT+=dt; raceT+=dt;
  if(deathMsgT>0) deathMsgT-=dt;
  let anyLow=false;
  for(const pl of players){ if(pl.out||pl.finished) continue;
    pl.timeLeft-=dt;
    if(pl.timeLeft<=6&&pl.timeLeft>0) anyLow=true;
    if(pl.timeLeft<=0){ pl.timeLeft=0; pl.out=true; pl.alive=false; Snd.over(); } }
  const secAll=Math.ceil(Math.min(...players.filter(pl=>!pl.out&&!pl.finished).map(pl=>pl.timeLeft),99));
  if(anyLow&&secAll!==lastTickSec){ lastTickSec=secAll; Snd.tick(); }
  if(players.every(pl=>pl.out)){ state='timeup'; stateT=0;
    if(document.pointerLockElement===cv&&document.exitPointerLock) document.exitPointerLock(); return; }
  if(players.every(pl=>pl.out||pl.finished)){ state='goal'; stateT=0;
    if(document.pointerLockElement===cv&&document.exitPointerLock) document.exitPointerLock(); return; }
  // steelie activation + AI
  const R=RACES[raceIdx];
  const leader=players.reduce((a,b)=>((b.out?-1:b.u)>(a.out?-1:a.u)?b:a),players[0]);
  if(R.steelie&&!steelie.active&&leader.u>R.steelie.triggerU){
    steelie.active=true; steelie.alive=true; steelie.v=R.steelie.v; steelie.u=R.steelie.u;
    const sh=groundH(steelie.v,steelie.u); steelie.z=(isNaN(sh)?4:sh)+1.5; steelie.grounded=false; steelie.vz=0;
    steelie.vv=0; steelie.vu=0; steelie.dropIn=true; }
  pollInput();
  players.forEach((pl,k)=>{
    if(pl.out||pl.finished) return;
    if(!pl.alive){ pl.deathT+=dt; if(pl.deathT>1.35) respawnPlayer(pl); return; }
    if(pl.hidden) return;
    if(k===0){
      if(mouseDV||mouseDU){ pl.vv+=mouseDV; pl.vu+=mouseDU; mouseDV=0; mouseDU=0; }
      marblePhysics(pl,dt,inpV*ACC,inpU*ACC);
    } else marblePhysics(pl,dt,inp2V*ACC,inp2U*ACC);
  });
  updateHazards(dt);
  if(steelie.active){
    if(steelie.alive){
      let av=0,au=0,best=null,bd=26;
      for(const pl of players) if(pl.alive&&!pl.out&&!pl.finished){
        const d=Math.hypot(pl.v-steelie.v,pl.u-steelie.u); if(d<bd){ bd=d; best=pl; } }
      if(best&&bd>0.01){ av=(best.v-steelie.v)/bd*11.5; au=(best.u-steelie.u)/bd*11.5; }
      marblePhysics(steelie,dt,av,au);
      const sp=Math.hypot(steelie.vv,steelie.vu);
      if(sp>8.5){ steelie.vv*=8.5/sp; steelie.vu*=8.5/sp; }
    } else {
      steelie.aiRespawnT-=dt;
      const near=racersRacing().find(pl=>pl.alive);
      if(steelie.aiRespawnT<=0&&near){
        steelie.alive=true; steelie.v=Math.max(2,Math.min(CV-2,near.v+6)); steelie.u=Math.min(CU-6,near.u+7);
        const sh=groundH(steelie.v,steelie.u);
        if(isNaN(sh)){ steelie.aiRespawnT=1; steelie.alive=false; }
        else { steelie.z=sh+1.5; steelie.grounded=false; steelie.vz=0; steelie.vv=0; steelie.vu=0; steelie.dropIn=true; }
      }
    }
  }
  if(numPlayers===2&&player.alive&&player2.alive&&!player.hidden&&!player2.hidden) collideMarbles(player,player2);
  for(const pl of players) if(pl.alive&&!pl.hidden&&steelie.active&&steelie.alive) collideMarbles(pl,steelie);
  // catch-up rule: trailing live player warped to leader's checkpoint.
  // It costs the trailing player a second, so it MUST have a cooldown — without one
  // it re-fired every physics step and drained a full minute in about seven seconds.
  if(catchupCD>0) catchupCD-=dt;
  if(numPlayers===2&&catchupCD<=0&&!player.out&&!player2.out&&!player.finished&&!player2.finished&&player.alive&&player2.alive){
    const dy=Math.abs((player.v*AXy+player.u*AUy)-(player2.v*AXy+player2.u*AUy));
    if(dy>560){ catchupCD=3;
      const lead=player.u>player2.u?player:player2, trail=lead===player?player2:player;
      trail.v=lead.lastSafe.v; trail.u=lead.lastSafe.u;
      const hh=groundH(trail.v,trail.u); trail.z=(isNaN(hh)?4:hh)+2.2;
      trail.vv=0; trail.vu=0; trail.vz=0; trail.grounded=false; trail.dropIn=true;
      trail.timeLeft=Math.max(1,trail.timeLeft-1); } }
  for(const pl of players){
    if(pl.out||pl.finished||!pl.alive) continue;
    if(pl.u>pl.maxU) pl.maxU=pl.u;
    if(Math.hypot(pl.vv,pl.vu)>1.2){ pl.moveAcc+=dt;
      if(pl.moveAcc>=1){ pl.moveAcc-=1; pl.score+=10; } }
    pl.safeT+=dt;
    const h2=groundH(pl.v,pl.u);
    if(pl.safeT>0.4&&pl.grounded&&Math.hypot(pl.vv,pl.vu)<7&&!inDyn(pl.v,pl.u)){ pl.safeT=0;
      const c=cellAt(pl.v,pl.u);
      if(c&&c.type===NORMAL){ let ok=true;
        for(const [dv,du] of [[0.9,0],[-0.9,0],[0,0.9],[0,-0.9]]){
          const hh=groundH(pl.v+dv,pl.u+du);
          if(isNaN(hh)||Math.abs(hh-(isNaN(h2)?0:h2))>0.8){ ok=false; break; } }
        if(ok) pl.lastSafe={v:pl.v,u:pl.u}; } }
    const c=cellAt(pl.v,pl.u);
    if(c&&c.type===GOAL&&pl.grounded&&!pl.finished){
      pl.finished=true; finishOrder.push(pl.pIdx);
      pl.carry=Math.max(0,pl.timeLeft)+(finishOrder.length===1&&numPlayers===2?5:0);
      if(finishOrder.length===1&&numPlayers===2) pl.score+=1000;
      pl.vv=0; pl.vu=0; Snd.goal(); }
  }
}

/* ---------- render ---------- */
function marbleScreen(m){ return { x:projX(m.v,m.u)+offX-camX, y:projY(m.v,m.u,m.z)+offY-camY-m.r*AZ*0.55 }; }
function addFloater(v,u,z,txt,col){ floaters.push({v,u,z,txt,col:col||'#ffd23a',t:0}); }
function updateCam(){
  const foc=players.filter(pl=>!pl.out&&!pl.finished&&pl.alive);
  const list=foc.length?foc:players.filter(pl=>!pl.out);
  const fv=list.length?list.reduce((a,p)=>a+p.v,0)/list.length:player.v;
  const fu=list.length?list.reduce((a,p)=>a+p.u,0)/list.length:player.u;
  const fz=list.length?list.reduce((a,p)=>a+p.z,0)/list.length:player.z;
  const px=projX(fv,fu)+offX, py=projY(fv,fu,fz)+offY;
  const tx=Math.max(0,Math.min(offW-640,px-320)), ty=Math.max(0,Math.min(offH-400,py-(FLIP?230:170)));
  if(!camInit){ camX=tx; camY=ty; camInit=true; }
  camX+=(tx-camX)*0.14; camY+=(ty-camY)*0.14;
}
/* Decor measured off the original: bright red tube arches with a lighter
   highlight along the top, and dark red chevrons painted on the floor. */
function archGate(g,ox,oy,v,u,span,hgt){
  // built in world space so it foreshortens with the projection, like the original's
  let SP=span||2.2; const HT=hgt||3.4;
  let hL=groundH(v-SP,u), hR=groundH(v+SP,u);
  while((isNaN(hL)||isNaN(hR))&&SP>0.6){   // shrink until both feet are on the course
    SP-=0.3; hL=groundH(v-SP,u); hR=groundH(v+SP,u); }
  if(isNaN(hL)||isNaN(hR)) return;
  const P=(vv,zz)=>[projX(vv,u)+ox, projY(vv,u,zz)+oy];
  const [lx,ly]=P(v-SP,hL), [ltx,lty]=P(v-SP,hL+HT);
  const [rx,ry]=P(v+SP,hR), [rtx,rty]=P(v+SP,hR+HT);
  const [cx,cy]=P(v,(hL+hR)/2+HT+0.55);
  const path=()=>{ g.beginPath(); g.moveTo(lx,ly); g.lineTo(ltx,lty);
    g.quadraticCurveTo(cx,cy,rtx,rty); g.lineTo(rx,ry); };
  g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle='#7d1a1d'; g.lineWidth=9; path(); g.stroke();
  g.strokeStyle=PAL.rail||'#dd3333'; g.lineWidth=6; path(); g.stroke();
  g.strokeStyle='rgba(255,180,170,.8)'; g.lineWidth=1.8;
  g.beginPath(); g.moveTo(ltx-2,lty); g.quadraticCurveTo(cx,cy-2,rtx-2,rty); g.stroke();
  g.lineCap='butt'; g.lineJoin='miter';
}
function floorArrow(g,ox,oy,v,u){
  const h=groundH(v,u); if(isNaN(h)) return;
  const px=projX(v,u)+ox, py=projY(v,u,h+0.04)+oy;
  g.save(); g.setTransform(AXx,AXy,AUx,AUy,px,py);
  g.fillStyle=PAL.arrow||'#a72222';
  for(const off of [0,1.5]){          // twin chevrons pointing along +u, as painted on the original
    g.beginPath();
    g.moveTo(-1.7+off,-1.5); g.lineTo(-0.5+off,-1.5); g.lineTo(1.5+off,0);
    g.lineTo(-0.5+off,1.5); g.lineTo(-1.7+off,1.5); g.lineTo(0.3+off,0);
    g.closePath(); g.fill();
  }
  g.setTransform(1,0,0,1,0,0); g.restore();
}
function drawMarbleG(g,m){
  const p=marbleScreen(m); const r=m.r*14;
  const h=groundH(m.v,m.u);
  if(!isNaN(h)){ const sy=projY(m.v,m.u,h)+offY-camY; const k=Math.max(0.35,1-(m.z-h)*0.12);
    g.fillStyle='rgba(40,40,40,.72)'; g.beginPath();   // hard-edged, like the original
    g.ellipse(projX(m.v,m.u)+offX-camX+2,sy-1,r*0.92*k,r*0.42*k,0,0,Math.PI*2); g.fill(); }
  // the Amiga sprite is flat-shaded: a solid disc, a hard dark crescent on the
  // shaded side, and a small light patch — not a glossy gradient sphere
  const C=(m.kind==='steelie')?['#8f96ad','#3a4058','#c9cee0']
        :(m.pIdx===1?['#3a56cc','#16255e','#93a8ff']:['#cc2222','#8b1a1a','#ee6644']);

  g.ellipse(p.x-r*0.44,p.y-r*0.46,r*0.20,r*0.15,-0.6,0,Math.PI*2); g.fill();

/* The Amiga marble carries chunky surface patches that visibly turn as it rolls
   (measured off the original sprite: red ball, olive-yellow blocks). Patches live
   on a unit sphere and are rotated about the axis perpendicular to travel. */
const SPIN_PATCHES=[[0,0,1],[0.72,0.16,0.68],[-0.62,0.38,0.68],[0.1,-0.8,0.59],[-0.15,0.86,0.49],[0.86,-0.42,0.29]];
function drawSpinPattern(g,m,cx,cy,r){
  const col=(m.kind==='steelie')?'#8f96ad':(m.pIdx===1?'#93a8ff':'#cccc00');
  const a=m.spin||0, tx=(m.spinX===undefined?1:m.spinX), ty=(m.spinY===undefined?0:m.spinY);
  const ax=-ty, ay=tx, az=0;                    // roll axis: perpendicular to travel
  const ca=Math.cos(a), sa=Math.sin(a);
  g.save();
  g.beginPath(); g.arc(cx,cy,r*0.97,0,Math.PI*2); g.clip();
  for(const [px0,py0,pz0] of SPIN_PATCHES){
    // Rodrigues rotation of the patch centre about (ax,ay,az)
    const dot=ax*px0+ay*py0+az*pz0;
    const rx=px0*ca+(ay*pz0-az*py0)*sa+ax*dot*(1-ca);
    const ry=py0*ca+(az*px0-ax*pz0)*sa+ay*dot*(1-ca);
    const rz=pz0*ca+(ax*py0-ay*px0)*sa+az*dot*(1-ca);
    if(rz<=0.06) continue;                       // on the far side
    const sx=cx+rx*r, sy=cy+ry*r, sz=Math.sqrt(Math.max(0.06,rz));
    g.fillStyle=col; g.globalAlpha=Math.min(1,0.35+rz);
    // blocky patches, as on the original sprite
    const pw=r*0.34*sz, ph=r*0.40*sz, ang=Math.atan2(ry,rx);
    g.translate(sx,sy); g.rotate(ang*0.35);
    g.fillRect(-pw/2,-ph/2,pw,ph);
    g.rotate(-ang*0.35); g.translate(-sx,-sy);
  }
  g.globalAlpha=1; g.restore();
}
function redrawFront(g,m){
  const mu=Math.floor(m.u), px=projX(m.v,m.u)+offX;
  const u0=Math.max(0,FLIP?mu-4:mu+1), u1=Math.min(CU-1,FLIP?mu-1:mu+4);
  for(let u=u0;u<=u1;u++)for(let v=0;v<CV;v++){ const c=cells[u]&&cells[u][v]; if(!c) continue;
    const cx=projX(v+0.5,u)+offX; if(Math.abs(cx-px)>90) continue;
    const ch=Math.max(c.h00,c.h10,c.h01,c.h11); if(ch<=m.z+0.2) continue;
    g.save(); g.translate(-camX,-camY);
    if(inDyn(v,u)){ const dc=dynCellAt(v,u); if(dc) drawCellC(g,v,u,offX,offY,dc); }
    else drawCell(g,v,u,offX,offY);

}
function hillCellC(v,u){ const c=cells[u][v]; if(!c) return null;
  return {h00:c.h00+hillsAt(v,u),h10:c.h10+hillsAt(v+1,u),h01:c.h01+hillsAt(v,u+1),
          h11:c.h11+hillsAt(v+1,u+1),type:c.type,tint:c.tint,tex:c.tex}; }

function drawMuncher(g,h){
  const gh=groundH(h.v,h.u); if(isNaN(gh)) return;
  const k=(h.state==='hop')?Math.sin(Math.min(1,h.hopK)*Math.PI):0;
  const px=projX(h.v,h.u)+offX-camX;

/* The Amiga HUD number font, measured glyph-by-glyph off the real screen

 '9':['########','###...##','###...##','.#######','......##','.....###','.######.','.#####..'],

function hudNum(g,str,x,y,scale,color,align){
  const cw=(8+1)*scale, w=String(str).length*cw;
  let px=align==='right'?x-w:(align==='center'?x-w/2:x);
  g.fillStyle=color;
  for(const ch of String(str)){
    const gl=HUD_FONT[ch];
    if(gl){ for(let r=0;r<8;r++){ const row=gl[r];
      let c=0;
      while(c<8){                       // run-length the row so we fill fewer rects
        if(row[c]==='#'){ let e=c; while(e<8&&row[e]==='#') e++;
          g.fillRect(px+c*scale, y+r*scale, (e-c)*scale, scale); c=e; }
        else c++;
      } } }
    px+=cw;
  }
  return w;
}
function textFlat(g,s,x,y,size,color,align){   // HUD digits: flat, no drop shadow
  g.font=`900 ${size}px "Courier New",monospace`; g.textAlign=align||'center'; g.textBaseline='middle';
  g.fillStyle=color; g.fillText(s,x,y);
}

function spaced(g,str,x,y,size,col,align){   // the original letter-spaces its text
  g.font=`900 ${size}px "Courier New",monospace`; g.textBaseline='middle';
  const gap=size*0.78, w=str.length*gap;
  let px=align==='center'?x-w/2:(align==='right'?x-w:x);
  g.textAlign='left';
  for(const ch of str){ if(ch!==' '){ g.fillStyle=col; g.fillText(ch,px,y); } px+=gap; }
  return w;
}

/* ---------- main loop ---------- */
let last=performance.now(), acc=0, autoStep=true;
const RACE_TRACKS=['practice','beginner','intermediate','aerial','silly','ultimate'];
let lastMusicKey='';
function updateMusic(){
  let key='';
  if(state==='title') key='title';
  else if(state==='ready'||state==='race'||state==='goal') key=RACE_TRACKS[raceIdx]||'';
  else if(state==='ending') key='ending';
  if(key!==lastMusicKey){ lastMusicKey=key; if(key) Music.play(key); else Music.stop(); }
  Music.tempo=(state==='race'&&raceIdx===4)?1+Math.min(0.6,raceT*0.025):1;
}
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.25) dt=0.25;
  if(autoStep){ acc+=dt; while(acc>=STEP){ physics(STEP); acc-=STEP; } }
  Snd.roll(Math.hypot(player.vv,player.vu),player.grounded&&player.alive&&state==='race');
  render(dt);
  requestAnimationFrame(frame);
}

    menuClick(){ optionsClick(); },
    setDifficulty(d){ OPT.difficulty=d%8; },
    ground(v,u){ const h=groundH(v,u); return isNaN(h)?null:+h.toFixed(3); },
    turbo(on){ turbo=!!on; }
  };
}
</script>
